  {"id":"concept-inflation-purchasing-power","slug":"inflation-purchasing-power","type":"concept","title":"Inflation & Purchasing Power","category":"Macro & Money","tags":["inflation","real-returns","purchasing-power","prices"],"difficulty":"beginner","relatedIds":["concept-inflation","concept-interest-rates","concept-economic-cycles","concept-asset-allocation"],"body":[{"type":"paragraph","text":"Inflation is a persistent increase in the general price level that reduces purchasing power when nominal wealth does not keep pace. Wealth planning must therefore distinguish nominal numbers from real economic outcomes."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Headline versus core inflation","Demand and supply drivers","Inflation expectations","Nominal versus real returns","Wage-price dynamics","Inflation hedges and their limits","Duration and inflation sensitivity","Personal purchasing-power budgeting"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The July 2026 IMF outlook says global disinflation has stalled and projects headline inflation at 4.7% in 2026, reinforcing why real-return thinking remains essential."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-monetary-system","slug":"monetary-system","type":"concept","title":"Monetary System & Central Banks","category":"Macro & Money","tags":["central-banks","money-supply","monetary-policy","liquidity"],"difficulty":"intermediate","relatedIds":["concept-interest-rates","concept-inflation-purchasing-power","concept-credit-and-debt","concept-economic-cycles"],"body":[{"type":"paragraph","text":"Modern economies use central banks and banking systems to influence liquidity, interest rates, payment systems and financial stability. Understanding the mechanism helps explain why markets can move before consumer prices or employment visibly change."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Central-bank mandates","Policy-rate transmission","Open-market operations","Reserve and liquidity mechanics","Bank money creation","Quantitative easing and tightening","Forward guidance","Financial-stability interventions"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The monetary system is a transmission network, not a single lever: policy changes propagate through credit, expectations, exchange rates, asset prices and spending."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-fiscal-policy","slug":"fiscal-policy","type":"concept","title":"Fiscal Policy & Public Finance","category":"Macro & Money","tags":["fiscal-policy","taxes","government-spending","deficits","debt"],"difficulty":"intermediate","relatedIds":["concept-monetary-system","concept-inflation-purchasing-power","concept-economic-cycles","concept-taxation"],"body":[{"type":"paragraph","text":"Fiscal policy changes aggregate demand, incentives, redistribution and the public-sector balance sheet through taxation, spending and borrowing. Private wealth is influenced by the fiscal environment even when the individual never trades government debt directly."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Government revenues and expenditures","Fiscal deficits and surpluses","Public debt and debt service","Automatic stabilizers","Discretionary fiscal policy","Tax incentives and subsidies","Crowding out and crowding in","Fiscal sustainability"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Public balance sheets matter because taxes, regulation, transfers, infrastructure spending and government borrowing alter the opportunity set facing households and businesses."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-credit-and-debt","slug":"credit-and-debt","type":"concept","title":"Credit, Debt & Leverage","category":"Risk & Protection","tags":["credit","debt","leverage","interest-coverage","default"],"difficulty":"intermediate","relatedIds":["concept-assets-vs-liabilities","concept-interest-rates","concept-liquidity","concept-insurance"],"body":[{"type":"paragraph","text":"Debt is a contract that exchanges current purchasing power for future obligations. It can accelerate productive investment or magnify losses when cash flows fail to support fixed payments."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Secured versus unsecured debt","Interest coverage","Debt-service coverage","Fixed versus floating rates","Maturity and refinancing risk","Debt covenants","Leverage ratios","Default and restructuring"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Good leverage finances durable cash-generating assets at a manageable cost; bad leverage turns a temporary shock into a solvency crisis."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-liquidity","slug":"liquidity","type":"concept","title":"Liquidity & Liquidity Risk","category":"Risk & Protection","tags":["liquidity","cash","redemption","liquidity-risk"],"difficulty":"beginner","relatedIds":["concept-cash-flow","concept-credit-and-debt","concept-private-markets","concept-wealth-accounting"],"body":[{"type":"paragraph","text":"Liquidity is the ability to meet obligations or convert an asset to usable cash without unacceptable loss. Wealth can be high on paper and fragile in practice if liquidity is poorly managed."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Emergency liquidity","Operating liquidity","Market liquidity","Funding liquidity","Bid-ask spreads and market depth","Redemption gates and lockups","Liquidity ladders","Liquidity stress testing"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Private assets, concentrated equity and leveraged positions can look attractive until a cash need arrives at exactly the wrong time."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-risk-return","slug":"risk-and-return","type":"concept","title":"Risk, Return & Expected Value","category":"Investing & Portfolio","tags":["risk","return","expected-value","downside","probability"],"difficulty":"beginner","relatedIds":[],"body":[{"type":"paragraph","text":"Risk is not simply volatility. A wealth system must distinguish permanent loss, variability, liquidity risk, leverage risk, model risk and uncertainty about outcomes."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Expected value","Probability-weighted outcomes","Volatility versus permanent loss","Downside scenarios","Risk-adjusted return","Margin of safety","Fat tails","Risk capacity versus risk tolerance"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The correct question is not “How much return can I make?” but “What range of outcomes can I survive, and is the upside worth the risk of the downside?”"}],"lastUpdated":"2026-08-31"},
  {"id":"concept-diversification","slug":"diversification","type":"concept","title":"Diversification & Correlation","category":"Investing & Portfolio","tags":["diversification","correlation","concentration","portfolio"],"difficulty":"beginner","relatedIds":["concept-risk-return","concept-asset-allocation","concept-exchange-rates","concept-private-markets"],"body":[{"type":"paragraph","text":"Diversification reduces exposure to any one source of failure when assets or income streams do not move perfectly together. It does not mean owning everything indiscriminately."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Correlation and covariance","Concentration risk","Diversification across asset classes","Geographic diversification","Currency exposure","Factor concentration","Hidden common exposures","When concentration can be rational"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Diversification is most valuable when you do not know which risk will dominate; concentration can be rational only when the underlying edge and downside are genuinely understood."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-asset-allocation","slug":"asset-allocation","type":"concept","title":"Asset Allocation","category":"Investing & Portfolio","tags":["asset-allocation","portfolio","strategic-allocation","tactical-allocation"],"difficulty":"intermediate","relatedIds":["concept-diversification","concept-risk-return","concept-liquidity","concept-private-markets"],"body":[{"type":"paragraph","text":"Asset allocation determines how capital is distributed across risk and return sources. It is a portfolio-level decision rather than a collection of individual security picks."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Strategic asset allocation","Tactical allocation","Risk budgets","Liquidity buckets","Growth versus defensive assets","Rebalancing","Spending needs and horizon","Total-portfolio thinking"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"A portfolio should be designed around the investor’s objectives, constraints and liabilities first; asset selection comes after the architecture."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-equity-valuation","slug":"equity-valuation","type":"concept","title":"Equity Valuation","category":"Investing & Portfolio","tags":["valuation","equity","discounted-cash-flow","multiples"],"difficulty":"advanced","relatedIds":["concept-time-value-of-money","concept-income-statement","concept-roic","concept-corporate-finance"],"body":[{"type":"paragraph","text":"Equity valuation estimates what a residual ownership claim is worth based on future cash flows, growth, risk and the price others are willing to pay. No valuation method eliminates uncertainty."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Discounted cash flow","Free-cash-flow yield","Price-to-earnings multiples","EV/EBITDA","Growth-adjusted valuation","Terminal value","Sensitivity analysis","Valuation versus market price"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The most dangerous valuation error is false precision: a tiny change in long-term assumptions can overwhelm apparent mathematical accuracy."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-corporate-finance","slug":"corporate-finance","type":"concept","title":"Corporate Finance","category":"Corporate Finance","tags":["corporate-finance","wacc","roic","capital-structure"],"difficulty":"advanced","relatedIds":["concept-roic","concept-capital-allocation","concept-equity","concept-equity-valuation"],"body":[{"type":"paragraph","text":"Corporate finance asks how a company should invest, finance itself and return capital while maximizing durable value. It connects operating strategy to the balance sheet and ownership structure."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Capital budgeting","Cost of capital","ROIC and incremental ROIC","Capital structure","Debt versus equity","Dividend policy","Buybacks","Reinvestment versus distribution"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The central corporate-finance question is whether each additional unit of capital can earn more than its opportunity cost at acceptable risk."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-roic","slug":"roic","type":"concept","title":"Return on Invested Capital","category":"Corporate Finance","tags":["roic","returns","capital-efficiency","reinvestment"],"difficulty":"advanced","relatedIds":["concept-economic-value-creation","concept-corporate-finance","concept-income-statement","concept-capital-allocation"],"body":[{"type":"paragraph","text":"ROIC measures how efficiently an operating business turns invested capital into operating profit after tax. More important than a single ROIC number is whether attractive returns can be reinvested at scale."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["NOPAT","Invested capital","Incremental ROIC","Reinvestment rate","Economic profit","ROIC versus WACC","Growth quality","Competitive durability"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"High growth with low incremental returns can destroy more value than slower growth with exceptional reinvestment economics."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-cap-table-dilution","slug":"cap-table-dilution","type":"concept","title":"Cap Tables, Equity & Dilution","category":"Ownership & Transactions","tags":["cap-table","dilution","equity","options","fundraising"],"difficulty":"intermediate","relatedIds":["concept-equity","concept-ownership","concept-fundraising","concept-ma-and-transactions"],"body":[{"type":"paragraph","text":"A cap table shows who owns what, under which rights and after which financing events. Understanding dilution is essential for founders, employees, investors and anyone receiving equity compensation."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Common versus preferred equity","Fully diluted ownership","Option pools","Pre-money and post-money valuation","Primary versus secondary transactions","Liquidation preferences","Anti-dilution provisions","Employee equity and vesting"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Headline company valuation is not the same thing as the value of a particular shareholder’s claim."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-fundraising","slug":"fundraising","type":"concept","title":"Fundraising & Venture Finance","category":"Ownership & Transactions","tags":["fundraising","venture-capital","term-sheet","runway"],"difficulty":"advanced","relatedIds":["concept-cap-table-dilution","concept-corporate-finance","concept-ownership","concept-liquidity"],"body":[{"type":"paragraph","text":"External capital can accelerate a good business but also changes ownership, governance, incentives and exit expectations. Raising money is a financing decision, not a badge of success."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Bootstrapping versus external capital","Runway and burn","Term sheets","Valuation and dilution","SAFE and convertible structures","Investor selection","Board and governance rights","Milestone-based financing"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The best financing is the one whose cost, control implications and required growth rate fit the business—not necessarily the one with the highest headline valuation."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-ma-and-transactions","slug":"ma-and-transactions","type":"concept","title":"M&A, Buyouts & Transactions","category":"Ownership & Transactions","tags":["mergers","acquisitions","buyouts","synergies","due-diligence"],"difficulty":"advanced","relatedIds":["concept-corporate-finance","concept-equity-valuation","concept-capital-allocation","concept-private-markets"],"body":[{"type":"paragraph","text":"M&A transfers control of productive assets and can create value through synergies, operational improvement, financing or better ownership. It can also destroy value through overpayment and integration failure."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Enterprise versus equity value","Purchase price allocation","Synergies","Accretion and dilution","Due diligence","Financing the acquisition","Integration risk","Exit multiples and returns"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"In a tougher 2026 private-market environment, value creation increasingly depends on entry discipline and operational improvement rather than easy leverage and multiple expansion."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-market-microstructure","slug":"market-microstructure","type":"concept","title":"Market Microstructure","category":"Market Structure","tags":["market-microstructure","liquidity","bid-ask","order-books","execution"],"difficulty":"advanced","relatedIds":["concept-liquidity","concept-risk-return","concept-asset-allocation","concept-derivatives"],"body":[{"type":"paragraph","text":"Market microstructure explains how orders become prices. It matters because the quoted price is not always the price at which meaningful size can actually transact."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Bid-ask spreads","Order books","Market makers","Limit versus market orders","Price impact","Slippage","Auction mechanisms","Execution quality"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Even a correct investment thesis can produce a poor realized return when liquidity, execution cost or market impact is ignored."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-derivatives","slug":"derivatives","type":"concept","title":"Derivatives & Hedging","category":"Market Structure","tags":["derivatives","options","futures","swaps","hedging"],"difficulty":"advanced","relatedIds":["concept-risk-return","concept-market-microstructure","concept-interest-rates","concept-insurance"],"body":[{"type":"paragraph","text":"Derivatives are contracts whose value depends on another asset or variable. They can transfer risk, create leverage or express views, but complexity can hide large nonlinear exposures."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Forwards and futures","Options and payoff diagrams","Calls and puts","Implied volatility","Greeks","Swaps","Hedging versus speculation","Counterparty and collateral risk"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Derivatives should be understood first as risk-transfer instruments; leverage is a consequence, not the purpose."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-behavioral-finance","slug":"behavioral-finance","type":"concept","title":"Behavioral Finance","category":"Behavioral & Decision Science","tags":["behavioral-finance","biases","decision-making","psychology"],"difficulty":"beginner","relatedIds":["concept-risk-return","concept-diversification","concept-capital-allocation","concept-opportunity-cost"],"body":[{"type":"paragraph","text":"Financial outcomes are shaped not only by mathematics but by predictable human biases. A robust wealth system therefore designs processes that reduce the damage caused by emotion and cognitive shortcuts."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Loss aversion","Overconfidence","Confirmation bias","Recency bias","Herding","Anchoring","Disposition effect","Incentive-induced behavior"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The strongest personal-finance process often wins by preventing a few catastrophic behavioral mistakes rather than by producing constant clever decisions."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-taxation","slug":"taxation","type":"concept","title":"Taxation & After-Tax Wealth","category":"Tax & Estate","tags":["taxes","after-tax-return","capital-gains","income-tax"],"difficulty":"intermediate","relatedIds":["concept-income-statement","concept-capital-allocation","concept-wealth-accounting","concept-estate-succession"],"body":[{"type":"paragraph","text":"Wealth compounds on what remains after taxes. Tax awareness is therefore part of capital allocation, while tax avoidance, evasion and compliance must be kept conceptually distinct."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Income versus capital-gains taxation","Tax brackets and marginal rates","Tax deferral","Tax-loss harvesting","Account wrappers","Capital gains timing","Business taxation","After-tax return calculations"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The relevant metric for many decisions is not pre-tax return but risk-adjusted after-tax wealth accumulation."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-estate-succession","slug":"estate-succession","type":"concept","title":"Estate Planning & Succession","category":"Tax & Estate","tags":["estate-planning","succession","inheritance","trusts","governance"],"difficulty":"advanced","relatedIds":["concept-ownership","concept-taxation","concept-wealth-accounting","concept-liquidity"],"body":[{"type":"paragraph","text":"Wealth can be lost or fragmented during transfer between generations. Estate and succession planning align ownership, control, liquidity and family objectives before a transition becomes urgent."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Beneficiary design","Wills and succession documents","Trust structures","Business succession","Liquidity for estate taxes and obligations","Family governance","Concentrated-asset transfer","Philanthropic structures"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The larger the ownership stake in an illiquid business or asset, the more important transfer planning becomes."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-real-assets-finance","slug":"real-assets-finance","type":"concept","title":"Real Estate & Real-Asset Finance","category":"Investing & Portfolio","tags":["real-estate","property","infrastructure","leverage","cap-rate"],"difficulty":"advanced","relatedIds":["concept-asset-allocation","concept-credit-and-debt","concept-liquidity","concept-interest-rates"],"body":[{"type":"paragraph","text":"Real assets combine physical scarcity, operating cash flows, financing and often inflation sensitivity. Their economics depend heavily on location, leverage, maintenance and capital intensity."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Capitalization rates","Net operating income","Loan-to-value","Debt-service coverage","Development economics","Occupancy and utilization","Infrastructure cash flows","Maintenance and replacement capex"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"A property is not automatically a hedge or a good investment: leverage, purchase price and operating economics determine the actual risk-return profile."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-private-markets","slug":"private-markets","type":"concept","title":"Private Markets & Illiquidity","category":"Investing & Portfolio","tags":["private-equity","venture-capital","private-credit","illiquidity","evergreen"],"difficulty":"advanced","relatedIds":["concept-risk-return","concept-liquidity","concept-asset-allocation","concept-ma-and-transactions"],"body":[{"type":"paragraph","text":"Private markets provide access to less-liquid ownership and credit opportunities but require stronger underwriting, longer horizons and careful attention to valuation and liquidity."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Private equity and buyouts","Growth equity","Venture capital","Private credit","Secondaries","Evergreen structures","Liquidity risk","Fees, valuation and governance"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"MSCI’s 2026 private-markets research highlights private-credit stress, liquidity constraints, evergreen structures and AI exposure as major forces reshaping the asset class."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-insurance","slug":"insurance","type":"concept","title":"Insurance & Risk Transfer","category":"Risk & Protection","tags":["insurance","risk-transfer","liability","protection"],"difficulty":"beginner","relatedIds":["concept-risk-return","concept-liquidity","concept-credit-and-debt","concept-wealth-accounting"],"body":[{"type":"paragraph","text":"Insurance transfers low-frequency, high-severity risks that could otherwise destroy a balance sheet. It is a risk-management tool, not an investment substitute."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Life insurance","Health and disability coverage","Property insurance","Liability coverage","Business interruption","Deductibles and self-insurance","Coverage limits","Exclusions and policy terms"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The right amount of insurance is determined by the financial consequence of a loss, not by the desire to eliminate every small inconvenience."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-income-human-capital","slug":"income-human-capital","type":"concept","title":"Human Capital Economics","category":"Human Capital","tags":["human-capital","income","skills","career","wage"],"difficulty":"beginner","relatedIds":["concept-productivity","concept-optionality","concept-economic-value-creation","concept-wealth-vs-income"],"body":[{"type":"paragraph","text":"For most people, the largest early-stage asset is the present value of future labor income. Skills, reputation, health, network and career choices therefore function as capital-allocation decisions."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Present value of future earnings","Skill premiums","Career optionality","Credential signaling","Reputation capital","Network effects","Geographic mobility","Automation and AI substitution/complementarity"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"AI-era career strategy should focus on complementarity and leverage: skills that let one person supervise, build or distribute more output rather than merely perform automatable tasks."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-economic-cycles","slug":"economic-cycles","type":"concept","title":"Economic Cycles & Regimes","category":"Macro & Money","tags":["business-cycle","recession","expansion","regimes","macro"],"difficulty":"intermediate","relatedIds":["concept-interest-rates","concept-inflation-purchasing-power","concept-monetary-system","concept-fiscal-policy"],"body":[{"type":"paragraph","text":"Economic regimes change the relative attractiveness of assets, business models and financing structures. A wealth system should be resilient to regime changes rather than optimized for one recent period."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Expansion and contraction","Credit cycles","Inflationary regimes","Deflationary shocks","Commodity cycles","Employment cycles","Liquidity regimes","Leading versus lagging indicators"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The July 2026 IMF outlook emphasizes slower growth, stalled disinflation and geopolitical/financial repricing risks, making regime awareness particularly relevant."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-exchange-rates","slug":"exchange-rates","type":"concept","title":"Currencies & Exchange Rates","category":"Macro & Money","tags":["currency","fx","exchange-rate","foreign-assets","hedging"],"difficulty":"intermediate","relatedIds":["concept-interest-rates","concept-inflation-purchasing-power","concept-asset-allocation","concept-economic-cycles"],"body":[{"type":"paragraph","text":"Exchange rates determine how wealth, income and liabilities translate across countries. International diversification therefore introduces both opportunity and currency risk."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Spot and forward FX","Purchasing-power parity","Interest-rate differentials","Currency appreciation and depreciation","Home-currency return","Foreign-asset exposure","Currency hedging","Trade and capital-flow effects"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"A foreign investment can gain in local terms and still lose in your home currency; total return must include the currency component."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-wealth-accounting","slug":"wealth-accounting","type":"concept","title":"Personal Wealth Accounting","category":"Wealth Architecture","tags":["net-worth","cash-flow","balance-sheet","wealth-accounting"],"difficulty":"beginner","relatedIds":["concept-net-worth","concept-cash-flow","concept-assets-vs-liabilities","concept-capital-allocation"],"body":[{"type":"paragraph","text":"Personal wealth accounting adapts business-finance discipline to an individual or household: track assets, liabilities, income, spending, liquidity and ownership claims as one balance sheet."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Personal balance sheet","Income statement for households","Cash-flow tracking","Liquidity reserve","Debt schedule","Asset allocation","Concentrated positions","Net-worth attribution"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The Wealth OS should ultimately let a person see not just how much they own, but what produced the change in wealth and what risks could reverse it."}],"lastUpdated":"2026-08-31"}
]);

const FRAMEWORK_CATEGORIES=['All','Decision Science','Strategy','Capital Allocation','Business Strategy','Career Strategy','Human Capital','Investing','Private Markets','AI Strategy','Wealth Strategy','Systems Thinking','Execution'];
function renderFrameworks(root, section){
  const records=KnowledgeBase.getByType('framework');
  root.innerHTML=`<div class="page-header"><div class="page-eyebrow">Knowledge · Phase 8</div><h1 class="page-title">${section.title}</h1><p class="page-desc">A decision toolkit for converting uncertainty into explicit assumptions, constraints, trade-offs and repeatable actions across career, business and capital allocation.</p></div>
  <div class="card" style="margin-bottom:14px"><div class="card-label">2026 MARKET LENS</div><div style="font-size:14px;line-height:1.65;color:var(--text-secondary);margin-top:6px">Frameworks emphasize AI adoption economics, skill-market shifts, private-market liquidity and valuation discipline, scenario planning, distribution, optionality and risk-aware capital allocation. They are designed to remain useful when market narratives change.</div></div>
  <div id="fw-controls" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div><div id="fw-grid" class="grid"></div><div id="fw-compare"></div>`;
  const controls=root.querySelector('#fw-controls'),grid=root.querySelector('#fw-grid'),compare=root.querySelector('#fw-compare');let active='All',selected=[];
  function paint(){
    controls.innerHTML=''; FRAMEWORK_CATEGORIES.filter(c=>c==='All'||records.some(r=>r.category===c)).forEach(c=>controls.appendChild(UI.Button({label:c,variant:c===active?'primary':'secondary',onClick:()=>{active=c;paint();}})));
    grid.innerHTML=''; records.filter(r=>active==='All'||r.category===active).forEach(r=>{const checked=selected.includes(r.id);const card=el(`<div class="card" style="cursor:pointer;position:relative"><div class="card-label">${r.category}</div><div style="font-size:17px;font-weight:650;margin-top:5px">${r.title}</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.55;margin-top:7px">${r.thesis}</div><div style="font-size:12px;color:var(--text-tertiary);margin-top:9px">${r.metrics.slice(0,3).join(' · ')}</div><button class="btn ${checked?'btn-primary':'btn-ghost'}" style="margin-top:11px" type="button">${checked?'Selected':'Compare'}</button></div>`);card.querySelector('button').addEventListener('click',e=>{e.stopPropagation();if(selected.includes(r.id))selected=selected.filter(x=>x!==r.id);else if(selected.length<3)selected.push(r.id);else toast('Compare up to 3 frameworks.');renderCompare();paint();});card.addEventListener('click',()=>navigate('frameworks/'+r.slug));grid.appendChild(card);});renderCompare();
  }
  function renderCompare(){if(selected.length<2){compare.innerHTML=selected.length?'<div class="card" style="margin-top:14px;color:var(--text-tertiary)">Select one more framework to compare.</div>':'';return;}const rs=selected.map(id=>KnowledgeBase.get(id));compare.innerHTML='<div class="card" style="margin-top:14px"><div class="card-label">FRAMEWORK COMPARISON</div><div class="data-table-wrap"><table class="data-table"><thead><tr><th>Dimension</th>'+rs.map(r=>`<th>${r.title}</th>`).join('')+'</tr></thead><tbody>'+[['Thesis','thesis'],['Trigger','trigger'],['Procedure','steps'],['Metrics','metrics'],['Failure modes','failureModes'],['Application','application']].map(([k,f])=>`<tr><td class="primary">${k}</td>`+rs.map(r=>`<td>${Array.isArray(r[f])?'<ul style="margin:0;padding-left:18px">'+r[f].map(x=>`<li>${x}</li>`).join('')+'</ul>':r[f]}</td>`).join('')+'</tr>').join('')+'</tbody></table></div></div>';}
  paint();
}

   4. ROUTER
   ============================================================ */
function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  return hash || 'dashboard';
}
function parseRoute(hash){
  const parts = hash.split('/').filter(Boolean);
  return { sectionId: parts[0] || 'dashboard', itemSlug: parts[1] || null };
}

function navigate(route){ location.hash = '#/' + route; }

function router(options={}){
  const { sectionId, itemSlug } = parseRoute(currentRoute());
  const skipTracking = !!options.skipTracking;
  const preserveAnimation = !!options.preserveAnimation;
  const root = document.getElementById('view-root');
  const routeKey = sectionId + (itemSlug ? '/' + itemSlug : '');
  if(root && root.dataset.renderedRoute === routeKey && !options.force){
    if(!preserveAnimation) root.classList.remove('view-enter');
    return;
  }
  const section = SECTION_BY_ID[sectionId] || SECTION_BY_ID['dashboard'];

  renderNav(section.id);
  root.classList.remove('view-enter');
  if(!preserveAnimation){
    void root.offsetWidth;
    root.classList.add('view-enter');
  }
  root.dataset.renderedRoute = routeKey;
  root.innerHTML = '';

  if(itemSlug){
    const type = SECTION_TYPE_MAP[section.id];
    const record = type ? KnowledgeBase.findBySlug(type, itemSlug) : null;
    if(record){
      document.getElementById('crumb-text').innerHTML = '<strong>' + section.title + '</strong> <span style="color:var(--text-tertiary);">/</span> ' + record.title;
      root.appendChild(renderKnowledgePanel(record));
      root.appendChild(renderRelationshipNetwork(record));
      root.appendChild(renderRelatedPanel(record));
      if(!skipTracking) trackVisit({ id: record.id, title: record.title, type: record.type, route: section.id + '/' + record.slug });
      return;
    }
    document.getElementById('crumb-text').innerHTML = '<strong>' + section.title + '</strong> <span style="color:var(--text-tertiary);">/</span> Not found';
    renderNotFound(root, section);
    trackVisit({ id: section.id, title: section.title, type:'section', route: section.id });
    return;
  }

  document.getElementById('crumb-text').innerHTML = '<strong>' + section.title + '</strong>';
  const renderer = RENDERERS[section.id] || renderSectionContent;
  renderer(root, section);
  trackVisit({ id: section.id, title: section.title, type:'section', route: section.id });
}

function trackVisit(item){
  if(item.type === 'section'){
    const visited = WOS.get('progress.sectionsVisited') || [];
    if(!visited.includes(item.id)){
      WOS.set('progress.sectionsVisited', visited.concat([item.id]));
    }
  }
  let recent = WOS.get('recentlyViewed') || [];
  recent = [{ id: item.id, title: item.title, type: item.type, route: item.route, ts: Date.now() }]
    .concat(recent.filter(r => r.id !== item.id))
    .slice(0, 6);
  WOS.set('recentlyViewed', recent);

  const todayStr = new Date().toDateString();
  const dates = WOS.get('meta.visitDates') || [];
  if(dates[dates.length-1] !== todayStr){
    WOS.set('meta.visitDates', dates.concat([todayStr]));
  }
  WOS.set('meta.lastOpened', Date.now());
  updateStreak();
}

function updateStreak(){
  const dates = (WOS.get('meta.visitDates') || []).slice().reverse();
  let streak = 0;
  let cursor = new Date();
  for(let i=0;i<dates.length;i++){
    const expected = cursor.toDateString();
    if(dates[i] === expected){ streak++; cursor.setDate(cursor.getDate()-1); }
    else if(i===0){ continue; }
    else break;
  }
  document.getElementById('streak-value').textContent = streak + 'd';
}

(function initSidebarToggle(){
  const shell=document.querySelector('.app-shell');
  const btn=document.getElementById('sidebar-collapse-btn');
  if(!shell || !btn) return;
  const saved=localStorage.getItem('wos.sidebarCollapsed');
  if(saved==='1') shell.classList.add('sidebar-collapsed');
  const sync=()=>{
    const collapsed=shell.classList.contains('sidebar-collapsed');
    btn.setAttribute('aria-label', collapsed?'Expand sidebar':'Collapse sidebar');
    btn.title=collapsed?'Expand sidebar':'Collapse sidebar';
    localStorage.setItem('wos.sidebarCollapsed', collapsed?'1':'0');
    window.dispatchEvent(new Event('resize'));
  };
  btn.addEventListener('click',()=>{ shell.classList.toggle('sidebar-collapsed'); sync(); });
  sync();
})();

/* ============================================================
   5. NAV RENDERING
   ============================================================ */
function navIconWrap(svgInner){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'+svgInner+'</svg>';
}

function renderNav(activeId){
  const groups = { primary: document.getElementById('nav-list-primary'), knowledge: document.getElementById('nav-list-knowledge'), execute: document.getElementById('nav-list-execute') };
  Object.values(groups).forEach(g => g.innerHTML = '');
  SECTIONS.forEach(s => {
    if(s.group === 'footer') return;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#/' + s.id;
    a.className = 'nav-item' + (s.id === activeId ? ' active' : '');
    a.innerHTML = navIconWrap(s.icon) + '<span>' + s.title + '</span>';
    attachRowContextMenu(a, { id: s.id, title: s.title, type: 'section' });
    li.appendChild(a);
    groups[s.group].appendChild(li);
  });
  // settings footer active state
  document.querySelectorAll('.sidebar-footer .nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.route === activeId);
  });
}

function progressRingSVG(pct){
  const r = 26, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `
    <svg class="progress-ring" width="64" height="64" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--border)" stroke-width="5"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--accent-blue)" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 32 32)"/>
    </svg>`;
}

/* ============================================================
   STRATEGY SIMULATOR — Phase 7.
   Generic weighted-distance matcher: compares a person's answers
   against each pathway's simProfile (added to the Atlas records
   in Phase 5/7) across the same set of dimensions. Nothing here
   is pathway-specific — adding a 17th pathway with a simProfile
   automatically makes it eligible to be recommended.
   ============================================================ */
const SIM_DIMENSIONS = [
  { key:'capital',    max:5, label:'Capital available' },
  { key:'risk',       max:5, label:'Risk tolerance' },
  { key:'time',       max:3, label:'Time horizon' },
  { key:'ownership',  max:5, label:'Ownership vs. employment preference' },
  { key:'scale',      max:5, label:'Desired scale' },
  { key:'technical',  max:5, label:'Technical skill' },
  { key:'sales',      max:5, label:'Sales ability' },
  { key:'leadership', max:5, label:'Leadership experience' },
  { key:'geoFlex',    max:5, label:'Location flexibility' },
  { key:'stability',  max:5, label:'Need for income stability' }
];

const SIM_QUESTIONS = [
  { key:'capital', label:'How much capital do you have available to deploy?', options:[
    {label:'Under $10k', value:1}, {label:'$10k–$100k', value:2}, {label:'$100k–$1M', value:4}, {label:'$1M+', value:5} ] },
  { key:'risk', label:'How do you feel about risking capital or income?', options:[
    {label:'I prefer stability', value:1}, {label:'Somewhat cautious', value:2}, {label:'Balanced', value:3}, {label:'Comfortable with real risk', value:4}, {label:'High risk, high reward', value:5} ] },
  { key:'time', label:'What\'s your time horizon for this to pay off?', options:[
    {label:'Under 3 years', value:1}, {label:'3–7 years', value:2}, {label:'7+ years, thinking long-term', value:3} ] },
  { key:'ownership', label:'Do you want ownership, or steady employment?', options:[
    {label:'Steady employment', value:1}, {label:'Open to either', value:3}, {label:'Ownership and equity', value:5} ] },
  { key:'scale', label:'How big do you want this to get?', options:[
    {label:'Solo / lifestyle business', value:1}, {label:'Moderate team, steady growth', value:3}, {label:'Venture-scale, no ceiling', value:5} ] },
  { key:'technical', label:'How strong are your technical skills?', options:[
    {label:'Low', value:1}, {label:'Some', value:2}, {label:'Solid', value:3}, {label:'Strong', value:4}, {label:'Expert', value:5} ] },
  { key:'sales', label:'How strong is your sales / persuasion ability?', options:[
    {label:'Low', value:1}, {label:'Some', value:2}, {label:'Solid', value:3}, {label:'Strong', value:4}, {label:'Expert', value:5} ] },
  { key:'leadership', label:'How much leadership / management experience do you have?', options:[
    {label:'Low', value:1}, {label:'Some', value:2}, {label:'Solid', value:3}, {label:'Strong', value:4}, {label:'Expert', value:5} ] },
  { key:'geoFlex', label:'How tied are you to a specific location?', options:[
    {label:'Tied to one place', value:1}, {label:'Somewhat flexible', value:3}, {label:'Fully remote / global', value:5} ] },
  { key:'stability', label:'How much income stability do you need right now?', options:[

];

function computeSimMatches(inputs){
  const pathways = KnowledgeBase.getByType('pathway').filter(p=>p.simProfile);
  return pathways.map(p=>{
    let totalDiff=0, count=0;
    const dimScores = {};
    SIM_DIMENSIONS.forEach(d=>{
      const uv = inputs[d.key], pv = p.simProfile[d.key];
      if(uv==null || pv==null) return;
      const diff = Math.abs(uv-pv)/d.max;
      dimScores[d.key] = 1-diff;
      totalDiff += diff; count++;
    });
    const score = count ? Math.round((1 - totalDiff/count)*100) : 0;
    const topDims = Object.entries(dimScores).sort((a,b)=>b[1]-a[1]).slice(0,2)
      .map(([k])=> SIM_DIMENSIONS.find(d=>d.key===k).label);
    return { id:p.id, score, why: topDims };
  }).sort((a,b)=>b.score-a.score);
}

function plannerCrudPanel({title,desc,path,fields,defaults={},empty}){
  const wrap=el(`<div class="card"><div class="card-label">${title}</div><div style="color:var(--text-secondary);font-size:13px;line-height:1.5;margin:6px 0 12px;">${desc}</div><div class="planner-form"></div><div class="planner-items" style="display:flex;flex-direction:column;gap:8px;margin-top:14px;"></div></div>`);
  const form=wrap.querySelector('.planner-form');
  fields.forEach(([key,label])=>{
    const input=el(`<div style="margin-bottom:8px;"><label style="display:block;font-size:12px;color:var(--text-tertiary);margin-bottom:4px;">${label}</label><input data-key="${key}" placeholder="${label}" style="width:100%;box-sizing:border-box;background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:9px 10px;font:inherit;"></div>`);
    form.appendChild(input);
  });
  const add=el(`<button class="btn btn-primary">Add</button>`); form.appendChild(el('<div style="display:flex;justify-content:flex-end;"></div>')).appendChild(add);
  const items=wrap.querySelector('.planner-items');
  function render(){
    const rows=plannerList(path); items.innerHTML='';
    if(!rows.length){items.appendChild(el(`<div class="empty-state">${empty}</div>`));return;}
    rows.forEach(row=>{
      const main=fields.slice(0,2).map(([k])=>row[k]).filter(Boolean).map(v=>plannerEscape(v)).join(' · ');
      const meta=fields.slice(2).map(([k])=>row[k]).filter(Boolean).map(v=>plannerEscape(v)).join(' · ');
      const card=el(`<div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-1);"><div style="min-width:0;"><div style="font-weight:650;">${main||'Untitled'}</div><div style="font-size:12px;color:var(--text-tertiary);margin-top:4px;">${meta}</div></div><button class="btn btn-danger" style="flex:0 0 auto;padding:6px 9px;">Delete</button></div>`);
      card.querySelector('button').onclick=()=>{plannerSave(path,rows.filter(x=>x.id!==row.id));render();showToast('Planner item removed.');}; items.appendChild(card);
    });
  }
  add.onclick=()=>{
    const row=Object.assign({id:plannerUid()},defaults);
    fields.forEach(([key])=>{row[key]=form.querySelector(`[data-key="${key}"]`).value.trim();});
    if(!row[fields[0][0]]){showToast('Add a title first.');return;}
    plannerSave(path,plannerList(path).concat([row]));
    fields.forEach(([key])=>form.querySelector(`[data-key="${key}"]`).value='');
    render();showToast('Planner item saved.');
  };
  render(); return wrap;
}

function buildCompletenessAudit(){
  const records = Object.values(KnowledgeBase.records || {});
  const missingRelations = [];
  const duplicateIds = [];
  const duplicateSlugs = [];
  const emptyBodies = [];
  const emptyTitles = [];
  const orphanRecords = [];
  const backlinkAsymmetry = [];
  const slugMap = {};
  const idSeen = {};
  records.forEach(r=>{
    if(!r.id || !String(r.title||'').trim()) emptyTitles.push(r.id||'(missing id)');
    if(idSeen[r.id]) duplicateIds.push(r.id); else idSeen[r.id]=1;
    (slugMap[r.type+'::'+r.slug] = slugMap[r.type+'::'+r.slug] || []).push(r.id);
    if(!Array.isArray(r.body) || !r.body.length) emptyBodies.push(r.id);
    const rels=(r.relatedIds||[]);
    const validRelations=rels.filter(id=>KnowledgeBase.records[id]);
    if(rels.length && validRelations.length===0) orphanRecords.push(r.id);
    rels.forEach(id=>{ if(!KnowledgeBase.records[id]) missingRelations.push(r.id+' → '+id); });
    validRelations.forEach(id=>{
      const back=KnowledgeBase.backlinks[id];
      if(!back || !back.has(r.id)) backlinkAsymmetry.push(r.id+' → '+id);
    });
  });
  Object.keys(slugMap).forEach(k=>{if(slugMap[k].length>1) duplicateSlugs.push(k+' → '+slugMap[k].join(', '));});
  const mappedSections=Object.entries(SECTION_TYPE_MAP).map(([section,type])=>({section,type,count:KnowledgeBase.getByType(type).length,hasRenderer:typeof RENDERERS[section]==='function'}));
  const emptyMappedSections=mappedSections.filter(x=>x.count===0 && SECTION_BY_ID[x.section]);
  const missingRenderers=mappedSections.filter(x=>x.count>0 && !x.hasRenderer && x.section!=='settings');
  const sectionRouteGaps=SECTIONS.filter(s=>s.group!=='footer' && s.id!=='dashboard').filter(s=>!SECTION_TYPE_MAP[s.id] && !RENDERERS[s.id]);
  const searchCoverage=records.filter(r=>!SearchIndex._entries.some(e=>e.id===r.id)).length;
  const audit=[
    {label:'Knowledge records',value:records.length,ok:records.length>0},
    {label:'Broken relationships',value:missingRelations.length,ok:missingRelations.length===0},
    {label:'Duplicate IDs',value:duplicateIds.length,ok:duplicateIds.length===0},
    {label:'Duplicate type/slug pairs',value:duplicateSlugs.length,ok:duplicateSlugs.length===0},
    {label:'Empty knowledge bodies',value:emptyBodies.length,ok:emptyBodies.length===0},
    {label:'Empty titles / IDs',value:emptyTitles.length,ok:emptyTitles.length===0},
    {label:'Empty mapped modules',value:emptyMappedSections.length,ok:emptyMappedSections.length===0},
    {label:'Missing renderers',value:missingRenderers.length,ok:missingRenderers.length===0},
    {label:'Route gaps',value:sectionRouteGaps.length,ok:sectionRouteGaps.length===0},
    {label:'Search coverage gaps',value:searchCoverage,ok:searchCoverage===0},
    {label:'Relationship asymmetry',value:backlinkAsymmetry.length,ok:backlinkAsymmetry.length===0},
    {label:'Unconnected records',value:orphanRecords.length,ok:true}
  ];
  return {records,missingRelations,duplicateIds,duplicateSlugs,emptyBodies,emptyTitles,orphanRecords,backlinkAsymmetry,mappedSections,emptyMappedSections,missingRenderers,sectionRouteGaps,searchCoverage,audit};
}

function validateImportedState(raw){
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) throw new Error('State must be an object');
  if(raw.meta && raw.meta.schemaVersion!=null && Number(raw.meta.schemaVersion)>SCHEMA_VERSION) throw new Error('Newer schema');
  const d=defaultState();
  const out=Object.assign(d, raw);
  ['bookmarks','recentlyViewed'].forEach(k=>{if(!Array.isArray(out[k])) out[k]=[];});
  if(!out.progress || typeof out.progress!=='object') out.progress=d.progress;
  if(!Array.isArray(out.progress.sectionsVisited)) out.progress.sectionsVisited=[];
  if(!Array.isArray(out.progress.topicsCompleted)) out.progress.topicsCompleted=[];
  if(!out.planner || typeof out.planner!=='object') out.planner=d.planner;
  ['annual','quarterly'].forEach(k=>{if(!Array.isArray(out.planner.goals?.[k])) out.planner.goals[k]=[];});
  ['careerRoadmap','businessRoadmap','investmentPlan','opportunityTracker','ideaVault','decisionJournal','skillTracker','readingTracker'].forEach(k=>{if(!Array.isArray(out.planner[k])) out.planner[k]=[];});
  if(!out.simulator || typeof out.simulator!=='object') out.simulator=d.simulator;
  if(!out.settings || typeof out.settings!=='object') out.settings=d.settings;
  out.meta=Object.assign(d.meta,out.meta||{}, {schemaVersion:SCHEMA_VERSION,lastOpened:Date.now()});
  return out;
}

function simulatorCalibration(inputs, results){
  if(!results.length) return results;
  // 2026 calibration: reward explicit ownership, technical leverage and scale
  // only when the user also has enough risk/capital tolerance; avoid hype bias.
  return results.map((r,i)=>{
    let adj=0;
    if(inputs.ownership>=4 && inputs.scale>=4 && inputs.risk>=3) adj+=1;
    if(inputs.stability<=2 && inputs.risk<=2) adj+=1;
    if(inputs.technical>=4 && ['AI/ML Engineer','Research Scientist','Quant Trader'].some(x=>x.toLowerCase()===String(KnowledgeBase.get(r.id)?.title||'').toLowerCase())) adj+=1;
    return Object.assign({},r,{calibratedScore:Math.max(0,Math.min(100,r.score+adj))});
  }).sort((a,b)=>b.calibratedScore-a.calibratedScore);
}

UI.Counter = function(targetEl, endValue, opts={}){
  const duration = opts.duration || 700;
  const suffix = opts.suffix || '';
  if(reducedMotionSafe()){ targetEl.textContent = endValue + suffix; return; }
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    targetEl.textContent = Math.round(eased*endValue) + suffix;
    if(p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
};
function reducedMotionSafe(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

/* ---- Constellation View — generic force-directed graph over any record set ----
   Content-agnostic: takes plain {id,title,category,slug} nodes and an edge list.
   Reused as-is for the Wealth Atlas now, and for the Industry Explorer's
   ecosystem map / Business Model relationship diagram later — no new engine
   code needed for those, just a different record set passed in. */
const CLUSTER_PALETTE = ['blue','green','gold','red'];
function clusterColor(category){
  let hash = 0;
  for(let i=0;i<category.length;i++) hash = (hash*31 + category.charCodeAt(i)) | 0;
  return CLUSTER_PALETTE[Math.abs(hash) % CLUSTER_PALETTE.length];
}

UI.ConstellationView = function({ records, sectionId, width=880, height=480 }={}){
  const nodes = records.map(r => ({ id:r.id, title:r.title, slug:r.slug, category:r.category||'', x:0, y:0, vx:0, vy:0 }));
  const nodeIds = new Set(nodes.map(n=>n.id));
  const nodeById = {}; nodes.forEach(n=> nodeById[n.id]=n);

  // build edges only between nodes present in this record set
  const edgeSet = new Set();
  const edges = [];
  records.forEach(r=>{
    Array.from(KnowledgeBase.graph[r.id]||[]).forEach(targetId=>{
      if(!nodeIds.has(targetId) || targetId === r.id) return;
      const key = [r.id, targetId].sort().join('|');
      if(edgeSet.has(key)) return;
      edgeSet.add(key);
      edges.push({ source: r.id, target: targetId });
    });
  });

  // initial layout: circle, so the simulation starts from a stable spread
  const cx = width/2, cy = height/2;
  const R = Math.min(width, height) * 0.32;
  nodes.forEach((n,i)=>{
    const angle = (i / nodes.length) * Math.PI * 2;
    n.x = cx + Math.cos(angle) * R;
    n.y = cy + Math.sin(angle) * R;
  });

  // simple force simulation — repulsion + spring edges + centering, run synchronously
  const REPULSION = 2600, SPRING_LEN = 130, SPRING_K = 0.02, CENTER_K = 0.01, DAMPING = 0.82;
  for(let iter=0; iter<180; iter++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a = nodes[i], b = nodes[j];
        let dx = a.x-b.x, dy = a.y-b.y;
        let dist = Math.sqrt(dx*dx+dy*dy) || 0.01;
        const force = REPULSION / (dist*dist);
        dx/=dist; dy/=dist;
        a.vx += dx*force; a.vy += dy*force;
        b.vx -= dx*force; b.vy -= dy*force;
      }
    }
    edges.forEach(e=>{
      const a = nodeById[e.source], b = nodeById[e.target];
      let dx = b.x-a.x, dy = b.y-a.y;
      let dist = Math.sqrt(dx*dx+dy*dy) || 0.01;
      const force = (dist - SPRING_LEN) * SPRING_K;
      dx/=dist; dy/=dist;
      a.vx += dx*force; a.vy += dy*force;
      b.vx -= dx*force; b.vy -= dy*force;
    });
    nodes.forEach(n=>{
      n.vx += (cx-n.x) * CENTER_K * 0.05;
      n.vy += (cy-n.y) * CENTER_K * 0.05;
      n.vx *= DAMPING; n.vy *= DAMPING;
      n.x += n.vx; n.y += n.vy;
    });
  }

  // clamp to bounds with padding
  const pad = 60;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  nodes.forEach(n=>{ minX=Math.min(minX,n.x); maxX=Math.max(maxX,n.x); minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y); });
  const spanX = Math.max(1,maxX-minX), spanY = Math.max(1,maxY-minY);
  nodes.forEach(n=>{
    n.x = pad + ((n.x-minX)/spanX) * (width-2*pad);
    n.y = pad + ((n.y-minY)/spanY) * (height-2*pad);
  });

  // --- render ---
  const wrap = el(`<div class="constellation-wrap"></div>`);
  const svgEdges = edges.map(e=>{
    const a = nodeById[e.source], b = nodeById[e.target];
    return `<line class="constellation-edge" data-a="${e.source}" data-b="${e.target}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  }).join('');
  const svgNodes = nodes.map(n=>{
    const tone = clusterColor(n.category);
    return `
      <g class="constellation-node" data-id="${n.id}" transform="translate(${n.x},${n.y})">
        <circle class="constellation-node-circle" r="7" fill="var(--accent-${tone})" fill-opacity="0.85"/>
        <circle r="7" fill="none" stroke="var(--accent-${tone})" stroke-opacity="0.3" stroke-width="6"/>
        <text class="constellation-label" x="11" y="4">${n.title}</text>
      </g>`;
  }).join('');

  wrap.innerHTML = `
    <div class="constellation-toolbar">
      <div class="constellation-toolbar-left">
        <span class="constellation-toolbar-label">Graph view</span>
        <button class="graph-control" type="button" data-graph-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
        <button class="graph-control" type="button" data-graph-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
        <button class="graph-control" type="button" data-graph-action="fit" aria-label="Fit graph to view" title="Fit graph to view">↔</button>
        <button class="graph-control" type="button" data-graph-action="reset" aria-label="Reset graph view" title="Reset graph view">⟳</button>
      </div>
      <div class="constellation-toolbar-right">
        <button class="graph-control" type="button" data-graph-action="fullscreen" aria-label="Expand graph" title="Expand graph">⛶</button>
      </div>
    </div>
    <div class="constellation-stage">
      <svg class="constellation-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g>${svgEdges}</g>
        <g>${svgNodes}</g>
      </svg>
    </div>
  `;

  // Graph viewport controls: zoom, fit-to-view, reset and fullscreen.
  const svg = wrap.querySelector('.constellation-svg');
  const baseViewBox = {x:0,y:0,w:width,h:height};
  let viewBox = {...baseViewBox};
  const applyViewBox = ()=> svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
  const zoom = factor => {
    const cx = viewBox.x + viewBox.w/2, cy = viewBox.y + viewBox.h/2;
    const nw = Math.max(width*0.35, Math.min(width*2.4, viewBox.w*factor));
    const nh = Math.max(height*0.35, Math.min(height*2.4, viewBox.h*factor));
    viewBox = {x:cx-nw/2,y:cy-nh/2,w:nw,h:nh}; applyViewBox();
  };
  const fit = ()=>{ viewBox={...baseViewBox}; applyViewBox(); };
  const toggleFullscreen = ()=>{
    wrap.classList.toggle('graph-fullscreen');
    document.body.classList.toggle('graph-modal-open', wrap.classList.contains('graph-fullscreen'));
    requestAnimationFrame(fit);
  };
  wrap.querySelectorAll('[data-graph-action]').forEach(btn=>btn.addEventListener('click',()=>{
    const action=btn.dataset.graphAction;
    if(action==='zoom-in') zoom(.8);
    else if(action==='zoom-out') zoom(1.25);
    else if(action==='fit') fit();
    else if(action==='reset') fit();
    else if(action==='fullscreen') toggleFullscreen();
  }));
  // Escape closes graph fullscreen.
  wrap.addEventListener('keydown', e=>{ if(e.key==='Escape' && wrap.classList.contains('graph-fullscreen')) toggleFullscreen(); });
  wrap.tabIndex=0;
  // Lightweight pan with pointer drag, preserving the existing static layout.
  let drag=null;
  svg.addEventListener('pointerdown', e=>{
    if(e.target.closest('.constellation-node')) return;
    drag={x:e.clientX,y:e.clientY,box:{...viewBox}}; svg.classList.add('is-dragging'); svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e=>{
    if(!drag) return;
    const rect=svg.getBoundingClientRect();
    const dx=(e.clientX-drag.x)*(viewBox.w/rect.width), dy=(e.clientY-drag.y)*(viewBox.h/rect.height);
    viewBox={...drag.box,x:drag.box.x-dx,y:drag.box.y-dy}; applyViewBox();
  });
  const endDrag=()=>{ drag=null; svg.classList.remove('is-dragging'); };
  svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('wheel', e=>{ e.preventDefault(); zoom(e.deltaY>0?1.08:.92); }, {passive:false});

  const legendCats = Array.from(new Set(nodes.map(n=>n.category))).filter(Boolean);
  if(legendCats.length){
    const legend = el('<div class="constellation-legend"></div>');
    legendCats.forEach(cat=>{
      legend.appendChild(el(`<div class="constellation-legend-item"><span class="constellation-legend-dot" style="background:var(--accent-${clusterColor(cat)})"></span>${cat}</div>`));
    });
    wrap.appendChild(legend);
  }

  // interactivity: hover highlights connected edges, click navigates
  wrap.querySelectorAll('.constellation-node').forEach(g=>{
    const id = g.dataset.id;
    g.addEventListener('mouseenter', ()=>{
      wrap.querySelectorAll(`.constellation-edge[data-a="${id}"], .constellation-edge[data-b="${id}"]`).forEach(l=> l.classList.add('hot'));
    });
    g.addEventListener('mouseleave', ()=>{
      wrap.querySelectorAll('.constellation-edge.hot').forEach(l=> l.classList.remove('hot'));
    });
    g.addEventListener('click', ()=>{
      const rec = nodeById[id];
      navigate(sectionId + '/' + rec.slug);
    });
  });

  return wrap;
};

/* ---- Tooltip ---- */
UI.Tooltip = (function(){
  let tipEl = null;
  function ensure(){
    if(!tipEl){ tipEl = el('<div class="wos-tooltip"></div>'); document.body.appendChild(tipEl); }
    return tipEl;
  }
  function attach(target, text){
    target.addEventListener('mouseenter', ()=>{
      const tip = ensure();
      tip.textContent = text;
      const r = target.getBoundingClientRect();
      tip.style.left = (r.left + r.width/2) + 'px';
      tip.style.top = (r.bottom + 8) + 'px';
      tip.style.transform = 'translateX(-50%) translateY(0)';
      requestAnimationFrame(()=> tip.classList.add('visible'));
    });
    target.addEventListener('mouseleave', ()=>{ if(tipEl) tipEl.classList.remove('visible'); });
  }
  return { attach };
})();

/* ---- Modal ---- */
UI.Modal = (function(){
  let overlay = null;
  function ensure(){
    if(!overlay){
      overlay = el(`
        <div class="modal-overlay">
          <div class="modal-box">
            <div class="modal-title"></div>
            <div class="modal-body"></div>
            <div class="modal-actions"></div>
          </div>
        </div>
      `);
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
    }
    return overlay;
  }
  function open({ title, body, actions=[] }){
    const ov = ensure();
    ov.querySelector('.modal-title').textContent = title;
    ov.querySelector('.modal-body').innerHTML = body;
    const actionsEl = ov.querySelector('.modal-actions');
    actionsEl.innerHTML = '';
    actions.forEach(a=>{
      const btn = UI.Button({ label: a.label, variant: a.variant||'secondary', onClick: ()=>{ if(a.onClick) a.onClick(); close(); } });
      actionsEl.appendChild(btn);
    });
    requestAnimationFrame(()=> ov.classList.add('open'));
  }
  function close(){ if(overlay) overlay.classList.remove('open'); }
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') close(); });
  return { open, close };
})();

/* ---- Context menu ---- */
UI.ContextMenu = (function(){
  let menuEl = null;
  function ensure(){
    if(!menuEl){ menuEl = el('<div class="context-menu"></div>'); document.body.appendChild(menuEl); }
    return menuEl;
  }
  function show(x, y, items){
    const menu = ensure();
    menu.innerHTML = '';
    items.forEach(it=>{
      if(it.divider){ menu.appendChild(el('<div class="context-menu-divider"></div>')); return; }
      const row = el(`<div class="context-menu-item${it.danger?' danger':''}">${it.icon||''}<span>${it.label}</span></div>`);
      row.addEventListener('click', ()=>{ hide(); if(it.onClick) it.onClick(); });
      menu.appendChild(row);
    });
    const vw = window.innerWidth, vh = window.innerHeight;
    menu.style.left = Math.min(x, vw-190) + 'px';
    menu.style.top = Math.min(y, vh-10-items.length*34) + 'px';
    menu.classList.add('open');
  }
  function hide(){ if(menuEl) menuEl.classList.remove('open'); }
  function attach(target, itemsFn){
    target.addEventListener('contextmenu', (e)=>{
      e.preventDefault();
      show(e.clientX, e.clientY, itemsFn());
    });
  }
  document.addEventListener('click', hide);
  window.addEventListener('scroll', hide, true);
  return { show, hide, attach };
})();

/* ---- Floating panel (popover) ---- */
UI.FloatingPanel = (function(){
  let panelEl = null;
  function ensure(){
    if(!panelEl){ panelEl = el('<div class="floating-panel"></div>'); document.body.appendChild(panelEl); }
    return panelEl;
  }
  function show(target, html){
    const panel = ensure();
    panel.innerHTML = html;
    const r = target.getBoundingClientRect();
    panel.style.left = r.left + 'px';
    panel.style.top = (r.bottom + 8) + 'px';
    panel.classList.add('open');
  }
  function hide(){ if(panelEl) panelEl.classList.remove('open'); }
  return { show, hide };
})();

/* ---- Command Palette (⌘K) — full modal, wired to SearchIndex ---- */
const CommandPalette = (function(){
  let overlay, input, list;
  let selected = 0;
  let results = [];

  function ensure(){
    if(overlay) return;
    overlay = el(`
      <div class="cmdk-overlay">
        <div class="cmdk-box">
          <div class="cmdk-input-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input class="cmdk-input" placeholder="Search sections, topics, actions…" autocomplete="off">
          </div>
          <div class="cmdk-list"></div>
          <div class="cmdk-footer">
            <span><kbd>&uarr;&darr;</kbd> navigate</span>
            <span><kbd>&crarr;</kbd> open</span>
            <span><kbd>esc</kbd> close</span>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(overlay);
    input = overlay.querySelector('.cmdk-input');
    list = overlay.querySelector('.cmdk-list');

    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });
    input.addEventListener('input', renderResults);
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'ArrowDown'){ e.preventDefault(); selected = Math.min(selected+1, results.length-1); paintSelection(); }
      else if(e.key === 'ArrowUp'){ e.preventDefault(); selected = Math.max(selected-1, 0); paintSelection(); }
      else if(e.key === 'Enter'){ e.preventDefault(); commit(selected); }
      else if(e.key === 'Escape'){ close(); }
    });
  }

  function renderResults(){
    const q = input.value;
    results = q.trim() ? SearchIndex.query(q) : SECTIONS.filter(s=>s.group!=='footer').map(s=>({ id:'section-'+s.id, title:s.title, type:'section', slug:s.slug, category:'Navigation', route:s.id }));
    selected = 0;
    if(!results.length){
      list.innerHTML = '<div class="cmdk-empty">No matches. Try a different term.</div>';
      return;
    }
    list.innerHTML = results.map((r,i)=>`
      <div class="cmdk-item${i===0?' selected':''}" data-index="${i}">
        <span>${r.title}</span>
        <span class="cmdk-item-type">${r.type}</span>
      </div>
    `).join('');
    list.querySelectorAll('.cmdk-item').forEach(node=>{
      node.addEventListener('click', ()=> commit(parseInt(node.dataset.index,10)));
      node.addEventListener('mousemove', ()=>{ selected = parseInt(node.dataset.index,10); paintSelection(); });
    });
  }

  function paintSelection(){
    list.querySelectorAll('.cmdk-item').forEach((n,i)=> n.classList.toggle('selected', i===selected));
    const activeNode = list.querySelector('.cmdk-item.selected');
    if(activeNode) activeNode.scrollIntoView({ block:'nearest' });
  }

  function commit(index){
    const r = results[index];
    if(!r) return;
    navigate(r.route);
    close();
  }

  function open(){
    ensure();
    overlay.classList.add('open');
    input.value = '';
    renderResults();
    setTimeout(()=> input.focus(), 50);
  }
  function close(){ if(overlay) overlay.classList.remove('open'); }

  return { open, close };
})();
UI.CommandPalette = CommandPalette;

/* ---- Bookmark helper (engine-level; works on sections and any content type) ---- */
function isBookmarked(id){ return (WOS.get('bookmarks')||[]).some(b=>b.id===id); }
function toggleBookmark(id, title, type, route){
  const list = WOS.get('bookmarks') || [];
  if(isBookmarked(id)){
    WOS.set('bookmarks', list.filter(b=>b.id!==id));
    showToast('Removed bookmark.');
  }else{
    WOS.set('bookmarks', list.concat([{ id, title, type, route: route || id, addedAt: Date.now() }]));
    showToast('Bookmarked.');
  }
  if(currentRoute() === 'dashboard') router({force:true});
}
UI.toggleBookmark = toggleBookmark;
UI.isBookmarked = isBookmarked;

function attachRowContextMenu(rowEl, { id, title, type, route }){
  const finalRoute = route || id;
  UI.ContextMenu.attach(rowEl, ()=>[
    { label:'Open', onClick: ()=> navigate(finalRoute) },
    { label: isBookmarked(id) ? 'Remove bookmark' : 'Bookmark', onClick: ()=> toggleBookmark(id, title, type, finalRoute) },
    { divider:true },
    { label:'Copy link', onClick: ()=>{
        const url = location.origin + location.pathname + '#/' + finalRoute;
        navigator.clipboard && navigator.clipboard.writeText(url).then(()=> showToast('Link copied.')).catch(()=> showToast('Could not copy link.'));
      } }
  ]);
}
UI.attachRowContextMenu = attachRowContextMenu;

/* ============================================================
   10. AMBIENT BACKGROUND — network canvas + motifs
   ============================================================ */
const reducedMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

try{
(function networkCanvas(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, nodes = [], pulses = [];
  const NODE_COUNT_BASE = 70;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const count = Math.min(140, Math.max(40, Math.round((w*h)/22000)));
  for(let i=0;i<count;i++){
    nodes.push({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.08, vy: (Math.random()-0.5)*0.08,
      r: Math.random()*1.4+0.6
    });
  }

  function maybeSpawnPulse(){
    if(reducedMotion) return;
    if(pulses.length > 4 || Math.random() > 0.01) return;
    const a = nodes[Math.floor(Math.random()*nodes.length)];
    let b = nodes[Math.floor(Math.random()*nodes.length)];
    let tries = 0;
    while(b===a && tries < 5){ b = nodes[Math.floor(Math.random()*nodes.length)]; tries++; }
    pulses.push({ a, b, t: 0, speed: 0.004 + Math.random()*0.003 });
  }

  function draw(){
    ctx.clearRect(0,0,w,h);

    // connections
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const n1=nodes[i], n2=nodes[j];
        const dx=n1.x-n2.x, dy=n1.y-n2.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const maxDist = 130;
        if(dist < maxDist){
          const op = (1 - dist/maxDist) * 0.12;
          ctx.strokeStyle = `rgba(140,150,170,${op})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(n1.x,n1.y); ctx.lineTo(n2.x,n2.y); ctx.stroke();
        }
      }
    }

    // nodes
    nodes.forEach(n=>{
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(180,190,210,0.35)';
      ctx.fill();
      if(!reducedMotion){
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > w) n.vx *= -1;
        if(n.y < 0 || n.y > h) n.vy *= -1;
      }
    });

    // pulses
    maybeSpawnPulse();
    pulses.forEach(p=>{
      p.t += p.speed;
      const x = p.a.x + (p.b.x-p.a.x)*p.t;
      const y = p.a.y + (p.b.y-p.a.y)*p.t;
      const grad = ctx.createRadialGradient(x,y,0,x,y,6);
      grad.addColorStop(0,'rgba(91,141,239,0.9)');
      grad.addColorStop(1,'rgba(91,141,239,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
    });
    pulses = pulses.filter(p=>p.t < 1);

    requestAnimationFrame(draw);
  }
  draw();
})();
}catch(e){ console.error('WOS: ambient network canvas failed to init', e); }
