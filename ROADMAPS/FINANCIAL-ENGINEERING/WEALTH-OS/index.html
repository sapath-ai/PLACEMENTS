<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wealth Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg: #050608;
  --surface: #101317;
  --surface-elevated: #181C22;
  --border: rgba(236,236,236,0.08);
  --border-strong: rgba(236,236,236,0.14);

  --text-primary: #ECECEC;
  --text-secondary: #8C9198;
  --text-tertiary: #565A61;

  --accent-green: #4FAE7A;   /* growth */
  --accent-blue: #5B8DEF;    /* knowledge */
  --accent-gold: #C9A25E;    /* ownership */
  --accent-red: #C4645C;     /* risk */

  --accent-green-glow: rgba(79,174,122,0.18);
  --accent-blue-glow: rgba(91,141,239,0.18);
  --accent-gold-glow: rgba(201,162,94,0.18);
  --accent-red-glow: rgba(196,100,92,0.18);

  --font-display: 'Inter', -apple-system, 'Geist', BlinkMacSystemFont, sans-serif;
  --font-body: 'Inter', -apple-system, 'Geist', BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 150ms;
  --dur-med: 250ms;
  --dur-slow: 300ms;

  --sidebar-w: 248px;
  --sidebar-collapsed-w: 0px;
  --topbar-h: 64px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}

*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{ height: 100%; }
body{
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

::selection{ background: var(--accent-blue-glow); color: var(--text-primary); }

::-webkit-scrollbar{ width: 10px; height: 10px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover{ background: rgba(236,236,236,0.22); }

a{ color: inherit; text-decoration: none; }
button{ font-family: inherit; cursor: pointer; }

:focus-visible{
  outline: 2px solid var(--accent-blue);
  outline-offset: 2px;
  border-radius: 4px;
}

h1, h2, h3, h4{ font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); }

/* ============================================================
   AMBIENT BACKGROUND — layered
   ============================================================ */
.bg-root{
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}

/* Layer 1 — slow moving gradient */
.bg-gradient{
  position: absolute; inset: -10%;
  background:
    radial-gradient(ellipse 60% 50% at 20% 15%, rgba(91,141,239,0.05), transparent 60%),
    radial-gradient(ellipse 55% 45% at 85% 80%, rgba(201,162,94,0.04), transparent 60%),
    radial-gradient(ellipse 50% 50% at 60% 40%, rgba(79,174,122,0.03), transparent 65%);
  animation: driftGradient 60s ease-in-out infinite alternate;
}
@keyframes driftGradient{
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(-2%, 2%) scale(1.05); }
}

/* Layer 2/3 — network canvas (nodes, connections, pulses) */
#bg-canvas{ position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.55; }

/* Layer 4 — floating ambient diagrams */
.bg-motifs{ position: absolute; inset: 0; }
.motif{
  position: absolute;
  opacity: 0;
  color: var(--text-secondary);
  animation-name: motifFade;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes motifFade{
  0%   { opacity: 0; transform: translateY(0) scale(1); }
  50%  { opacity: 0.06; transform: translateY(-14px) scale(1.03); }
  100% { opacity: 0; transform: translateY(0) scale(1); }
}

/* Layer 5 — noise texture */
.bg-noise{
  position: absolute; inset: 0;
  opacity: 0.025;
  mix-blend-mode: overlay;
}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell{ position: relative; z-index: 1; display: flex; min-height: 100vh; }
.app-shell.sidebar-collapsed .sidebar{ width:0; padding-left:0; padding-right:0; border-right-color:transparent; overflow:hidden; }
.app-shell.sidebar-collapsed .sidebar > *{ opacity:0; pointer-events:none; }
.sidebar-collapse-btn{
  position:absolute; left:calc(var(--sidebar-w) - 14px); top:76px; z-index:30; width:28px; height:28px;
  border:1px solid var(--border-strong); border-radius:50%; background:var(--surface-elevated);
  color:var(--text-secondary); display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 22px rgba(0,0,0,.35); transition:left var(--dur-med) var(--ease), transform var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.sidebar-collapse-btn:hover{ color:var(--text-primary); transform:scale(1.05); }
.app-shell.sidebar-collapsed .sidebar-collapse-btn{ left:14px; }
.sidebar-collapse-btn svg{ width:14px; height:14px; transition:transform var(--dur-med) var(--ease); }
.app-shell.sidebar-collapsed .sidebar-collapse-btn svg{ transform:rotate(180deg); }

/* ---- Sidebar ---- */
.sidebar{
  width: var(--sidebar-w);
  transition: width var(--dur-med) var(--ease), padding var(--dur-med) var(--ease), border-color var(--dur-med) var(--ease);
  flex-shrink: 0;
  background: rgba(16,19,23,0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand{
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 22px 10px;
}
.brand-mark{
  width: 26px; height: 26px; border-radius: 7px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
  flex-shrink: 0;
  position: relative;
}
.brand-mark::after{
  content: ''; position: absolute; inset: 6px;
  border: 1.5px solid rgba(5,6,8,0.55); border-radius: 3px;
}
.brand-text{ display: flex; flex-direction: column; line-height: 1.2; }
.brand-title{ font-family: var(--font-display); font-weight: 700; font-size: 13.5px; letter-spacing: -0.01em; }
.brand-sub{ font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.02em; }

.nav-group-label{
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--text-tertiary); text-transform: uppercase;
  padding: 14px 12px 6px 12px;
}

.nav-list{ list-style: none; display: flex; flex-direction: column; gap: 1px; }

.nav-item{
  display: flex; align-items: center; gap: 11px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500;
  position: relative;
  transition: color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.nav-item:not(a){ background: transparent; border: 1px solid transparent; font-family: inherit; }
button.nav-item{ appearance:none; -webkit-appearance:none; text-align:left; cursor:pointer; }
.relationship-action{
  appearance:none;
  -webkit-appearance:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:40px;
  padding:10px 15px;
  background:rgba(7,12,22,.82);
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  color:var(--text-primary);
  font:inherit;
  font-weight:650;
  line-height:1.2;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.05);
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease;
}
.relationship-action:hover{
  color:var(--text-primary);
  background:rgba(14,25,43,.98);
  border-color:rgba(90,170,255,.62);
  box-shadow:0 6px 18px rgba(0,0,0,.24),0 0 0 1px rgba(90,170,255,.09);
  transform:translateY(-1px);
}
.relationship-action:active{transform:translateY(0);}
.relationship-action:focus-visible{
  outline:2px solid var(--accent-blue);
  outline-offset:2px;
}
.nav-item svg{ width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
.nav-item:hover{ color: var(--text-primary); background: rgba(236,236,236,0.03); }
.nav-item.active{
  color: var(--text-primary);
  background: rgba(91,141,239,0.07);
}
.nav-item.active::before{
  content: '';
  position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 2px; height: 16px; border-radius: 2px;
  background: var(--accent-blue);
  box-shadow: 0 0 8px var(--accent-blue-glow);
}

.sidebar-footer{
  margin-top: auto;
  padding: 12px 12px 4px 12px;
  border-top: 1px solid var(--border);
}
.streak-pill{
  display: flex; align-items: center; justify-content: space-between;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-tertiary);
  padding-top: 12px;
}

/* ---- Main column ---- */
.main-col{ flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar{
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 16px;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(5,6,8,0.4);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  position: sticky; top: 0; z-index: 5;
}

.crumb{ font-size: 12.5px; color: var(--text-secondary); font-family: var(--font-mono); }
.crumb strong{ color: var(--text-primary); font-weight: 600; }

.search-wrap{ position: relative; margin-left: auto; width: 340px; }
.search-input{
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 12.5px;
  padding: 8px 34px 8px 32px;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.search-input::placeholder{ color: var(--text-tertiary); }
.search-input:focus{ border-color: var(--border-strong); background: var(--surface-elevated); outline: none; }
.search-icon{
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  width: 13px; height: 13px; color: var(--text-tertiary); pointer-events: none;
}
.search-kbd{
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary);
  border: 1px solid var(--border-strong); border-radius: 4px; padding: 1.5px 5px;
  pointer-events: none;
}
.search-results{
  position: absolute; top: calc(100% + 6px); left: 0; right: 0;
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  overflow: hidden;
  display: none;
  z-index: 20;
}
.search-results.open{ display: block; }
.search-result-item{
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 14px; font-size: 12.5px; color: var(--text-primary);
  transition: background var(--dur-fast) var(--ease);
}
.search-result-item:hover{ background: rgba(91,141,239,0.08); }
.search-result-type{
  font-family: var(--font-mono); font-size: 9.5px; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.05em;
}
.search-empty{ padding: 14px; font-size: 12px; color: var(--text-tertiary); }

/* ---- Content viewport ---- */
.viewport{ flex: 1; padding: 32px 36px 64px 36px; max-width: 1280px; width: 100%; }

.view-enter{ animation: viewFade var(--dur-slow) var(--ease); }
@keyframes viewFade{
  from{ opacity: 0; transform: translateY(6px); }
  to{ opacity: 1; transform: translateY(0); }
}

.page-header{ margin-bottom: 28px; }
.page-eyebrow{
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em;
  color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 8px;
}
.page-title{ font-size: 26px; margin-bottom: 6px; }
.page-desc{ color: var(--text-secondary); font-size: 13.5px; max-width: 640px; }

/* ---- Widget grid (dashboard) ---- */
.grid{ display: grid; gap: 16px; }
.grid-dashboard{
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: max-content;
  align-items: start;
}
.grid-dashboard > .card{ min-width:0; align-self:start; }
.grid-dashboard > .dashboard-analytics{
  display:flex;
  flex-direction:column;
  min-height:0;
  align-self:start;
}
.grid-dashboard > .dashboard-analytics .dashboard-analytics-metrics{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin:12px 0;
}
.grid-dashboard > .dashboard-analytics .dashboard-analytics-metrics .metric-card{
  min-height:76px;
}
.dashboard-analytics-types{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:auto;
}
.dashboard-analytics-type{
  min-width:0;
  padding:8px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:rgba(255,255,255,.018);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
}
.dashboard-analytics-type .settings-row-label{
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.dashboard-analytics-type .settings-row-desc{
  flex-shrink:0;
}
.span-2{ grid-column: span 2; }
.span-4{ grid-column: span 4; }

.card{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  transition: transform var(--dur-med) var(--ease), border-color var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
}
.card:hover{ transform: translateY(-2px); border-color: var(--border-strong); background: var(--surface-elevated); }

.card-label{
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
  color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 10px;
}
.card-value{ font-size: 22px; font-weight: 700; font-family: var(--font-display); }
.card-sub{ font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

.empty-state{
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  color: var(--text-tertiary); font-size: 12.5px; padding: 6px 0;
}
.empty-state .hint{ color: var(--text-secondary); font-size: 12px; }

.progress-ring-wrap{ display: flex; align-items: center; gap: 16px; }
.progress-ring{ flex-shrink: 0; }
.progress-ring circle{ transition: stroke-dashoffset var(--dur-slow) var(--ease); }

.badge{
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.03em;
  padding: 3px 8px; border-radius: 100px;
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
}
.badge-dot{ width: 5px; height: 5px; border-radius: 50%; }
.dot-green{ background: var(--accent-green); }
.dot-blue{ background: var(--accent-blue); }
.dot-gold{ background: var(--accent-gold); }
.dot-red{ background: var(--accent-red); }

/* ---- Placeholder / coming-soon module pages ---- */
.placeholder-panel{
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 48px 32px;
  text-align: center;
  color: var(--text-secondary);
}
.placeholder-panel .phase-tag{
  display: inline-block; font-family: var(--font-mono); font-size: 10.5px;
  color: var(--accent-blue); border: 1px solid rgba(91,141,239,0.3);
  background: var(--accent-blue-glow); padding: 4px 10px; border-radius: 100px;
  margin-bottom: 14px; letter-spacing: 0.03em;
}
.placeholder-panel h3{ font-size: 16px; margin-bottom: 8px; color: var(--text-primary); }
.placeholder-panel p{ font-size: 12.5px; max-width: 420px; margin: 0 auto; }

/* ---- Settings ---- */
.settings-row{
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0; border-bottom: 1px solid var(--border);
}
.settings-row:last-child{ border-bottom: none; }
.settings-row-label{ font-size: 13px; color: var(--text-primary); font-weight: 500; }
.settings-row-desc{ font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

.btn{
  font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--surface-elevated); color: var(--text-primary);
  transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.btn:hover{ transform: translateY(-1px); border-color: rgba(236,236,236,0.24); }
.btn:active{ transform: translateY(0); }
.btn-primary{ background: rgba(91,141,239,0.12); border-color: rgba(91,141,239,0.35); color: #cddbfb; }
.btn-danger{ background: rgba(196,100,92,0.1); border-color: rgba(196,100,92,0.35); color: #e9b6b1; }

/* ---- Toast ---- */
.toast-wrap{ position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast{
  background: var(--surface-elevated); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); padding: 10px 16px; font-size: 12.5px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  animation: toastIn var(--dur-med) var(--ease);
  display: flex; align-items: center; gap: 8px;
}
@keyframes toastIn{ from{ opacity: 0; transform: translateY(8px); } to{ opacity: 1; transform: translateY(0); } }

/* ============================================================
   COMPONENT REGISTRY — Phase 2
   ============================================================ */

/* ---- Card variants ---- */
.metric-card{
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 18px 20px; transition: transform var(--dur-med) var(--ease), border-color var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
}
.metric-card:hover{ transform: translateY(-2px); border-color: var(--border-strong); background: var(--surface-elevated); }
.metric-card .m-label{ font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 10px; }
.metric-card .m-value{ font-size: 22px; font-weight: 700; font-family: var(--font-display); }
.metric-card .m-sub{ font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

.knowledge-card{
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
  padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer;
  transition: transform var(--dur-med) var(--ease), border-color var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
}
.knowledge-card:hover{ transform: translateY(-2px); border-color: var(--border-strong); background: var(--surface-elevated); }
.knowledge-card .k-eyebrow{ font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.05em; color: var(--text-tertiary); text-transform: uppercase; }
.knowledge-card .k-title{ font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
.knowledge-card .k-desc{ font-size: 12px; color: var(--text-secondary); }

.insight-card{
  background: var(--surface); border: 1px solid var(--border); border-left: 2px solid var(--accent-blue);
  border-radius: var(--radius-md); padding: 14px 16px;
}
.insight-card.tone-green{ border-left-color: var(--accent-green); }
.insight-card.tone-gold{ border-left-color: var(--accent-gold); }
.insight-card.tone-red{ border-left-color: var(--accent-red); }
.insight-card .i-title{ font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
.insight-card .i-body{ font-size: 12px; color: var(--text-secondary); }

.comparison-card{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
.comparison-card .c-row{ display: flex; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.comparison-card .c-row:last-child{ border-bottom: none; }
.comparison-card .c-row .c-key{ color: var(--text-secondary); }
.comparison-card .c-row .c-val{ color: var(--text-primary); font-weight: 600; font-family: var(--font-mono); }

/* ---- Buttons (registry variants beyond .btn) ---- */
.btn-ghost{ background: transparent; border-color: transparent; color: var(--text-secondary); }
.btn-ghost:hover{ background: rgba(236,236,236,0.04); color: var(--text-primary); border-color: transparent; }

/* ---- Progress bar ---- */
.progress-bar-track{ width: 100%; height: 6px; border-radius: 100px; background: rgba(236,236,236,0.06); overflow: hidden; }
.progress-bar-fill{ height: 100%; border-radius: 100px; background: var(--accent-blue); transition: width var(--dur-slow) var(--ease); }

/* ---- Tabs ---- */
.tabs-header{ display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab-btn{
  font-size: 12.5px; font-weight: 600; color: var(--text-secondary); background: transparent; border: none;
  padding: 9px 4px; margin-right: 18px; position: relative; transition: color var(--dur-fast) var(--ease);
}
.tab-btn:hover{ color: var(--text-primary); }
.tab-btn.active{ color: var(--text-primary); }
.tab-btn.active::after{ content:''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--accent-blue); border-radius: 2px 2px 0 0; }

/* ---- Accordion ---- */
.accordion-item{ border-bottom: 1px solid var(--border); }
.accordion-item:last-child{ border-bottom: none; }
.accordion-trigger{
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: transparent; border: none; color: var(--text-primary); font-size: 13px; font-weight: 500;
  padding: 13px 2px; text-align: left;
}
.accordion-trigger .a-chev{ width: 14px; height: 14px; color: var(--text-tertiary); transition: transform var(--dur-fast) var(--ease); flex-shrink: 0; }
.accordion-item.open .a-chev{ transform: rotate(180deg); }
.accordion-body{ max-height: 0; overflow: hidden; transition: max-height var(--dur-slow) var(--ease); font-size: 12.5px; color: var(--text-secondary); }
.accordion-item.open .accordion-body{ max-height: 300px; }
.accordion-body-inner{ padding: 0 2px 14px 2px; }

/* ---- Timeline ---- */
.timeline{ position: relative; padding-left: 22px; }
.timeline::before{ content:''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--border-strong); }
.timeline-item{ position: relative; padding-bottom: 20px; }
.timeline-item:last-child{ padding-bottom: 0; }
.timeline-dot{ position: absolute; left: -22px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 2px solid var(--text-tertiary); }
.timeline-item.done .timeline-dot{ border-color: var(--accent-green); background: var(--accent-green); }
.timeline-item.active .timeline-dot{ border-color: var(--accent-blue); background: var(--accent-blue); box-shadow: 0 0 0 4px var(--accent-blue-glow); }
.timeline-title{ font-size: 13px; font-weight: 600; color: var(--text-primary); }
.timeline-desc{ font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ---- Comparison Table ---- */
.data-table{ width: 100%; border-collapse: collapse; font-size: 12.5px; }
.data-table th{ text-align: left; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 12px; border-bottom: 1px solid var(--border-strong); }
.data-table td{ padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
.data-table tr:last-child td{ border-bottom: none; }
.data-table td.primary{ color: var(--text-primary); font-weight: 500; }

/* ---- Constellation / graph view ---- */
.constellation-wrap{ position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.constellation-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.012); }
.constellation-toolbar-left,.constellation-toolbar-right{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.constellation-toolbar-label{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); margin-right:4px; }
.graph-control{ width:30px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:var(--radius-sm); background:transparent; color:var(--text-secondary); }
.graph-control:hover{ border-color:var(--border-strong); color:var(--text-primary); background:rgba(255,255,255,.03); }
.graph-control svg{ width:14px; height:14px; }
.constellation-stage{ position:relative; width:100%; min-height:420px; background:radial-gradient(circle at 50% 45%, rgba(91,141,239,.035), transparent 55%); overflow:hidden; }
.constellation-svg{ display:block; width:100%; height:auto; min-height:420px; touch-action:none; cursor:grab; }
.constellation-svg.is-dragging{ cursor:grabbing; }
.constellation-wrap.graph-fullscreen{ position:fixed; inset:16px; z-index:500; margin:0; border-radius:var(--radius-lg); box-shadow:0 30px 100px rgba(0,0,0,.7); display:flex; flex-direction:column; }
.constellation-wrap.graph-fullscreen .constellation-stage{ flex:1; min-height:0; }
.constellation-wrap.graph-fullscreen .constellation-svg{ height:100%; min-height:0; }
body.graph-modal-open{ overflow:hidden; }
.constellation-edge{ stroke: rgba(140,150,170,0.18); stroke-width: 1; transition: stroke var(--dur-fast) var(--ease), stroke-width var(--dur-fast) var(--ease); }
.constellation-edge.hot{ stroke: var(--accent-blue); stroke-width: 1.6; }
.constellation-node-circle{ cursor: pointer; transition: r var(--dur-fast) var(--ease), filter var(--dur-fast) var(--ease); }
.constellation-node{ cursor: pointer; }
.constellation-node:hover .constellation-node-circle{ filter: brightness(1.3); }
.constellation-label{ font-family: var(--font-mono); font-size: 9.5px; fill: var(--text-secondary); pointer-events: none; user-select: none; }
.constellation-legend{ display:flex; flex-wrap:wrap; gap:14px; padding: 12px 18px; border-top: 1px solid var(--border); }
.constellation-legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--text-secondary); }
.constellation-legend-dot{ width:8px; height:8px; border-radius:50%; }

/* ---- Strategy Simulator: choice groups + results ---- */
.choice-group{ margin-bottom: 22px; }
.choice-group-label{ font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
.choice-group-sub{ display:block; font-size: 11.5px; font-weight: 400; color: var(--text-tertiary); margin-top: 2px; }
.choice-group-pills{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.choice-pill{
  font-size: 12.5px; font-weight: 500; color: var(--text-secondary);
  background: var(--surface); border: 1px solid var(--border); border-radius: 100px;
  padding: 7px 14px; transition: all var(--dur-fast) var(--ease);
}
.choice-pill:hover{ border-color: var(--border-strong); color: var(--text-primary); }
.choice-pill.selected{ background: rgba(91,141,239,0.12); border-color: rgba(91,141,239,0.4); color: #cddbfb; }

.sim-wizard{ max-width: 640px; }
.sim-wizard-section{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px 26px; margin-bottom: 16px; }
.sim-wizard-section h3{ font-size: 14px; margin-bottom: 16px; color: var(--text-primary); }

.sim-result-card{
  display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 10px; cursor: pointer;
  opacity: 0; transform: translateY(8px); animation: simResultIn var(--dur-slow) var(--ease) forwards;
  transition: border-color var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
}
.sim-result-card:hover{ border-color: var(--border-strong); background: var(--surface-elevated); }
@keyframes simResultIn{ to{ opacity: 1; transform: translateY(0); } }
.sim-result-rank{ font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--text-tertiary); width: 32px; flex-shrink: 0; }
.sim-result-body{ flex: 1; min-width: 0; }
.sim-result-title{ font-size: 14px; font-weight: 600; color: var(--text-primary); }
.sim-result-why{ font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.sim-result-score{ font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--accent-blue); flex-shrink: 0; }

/* ---- Tooltip ---- */
.wos-tooltip{
  position: fixed; z-index: 200; background: #0c0e11; border: 1px solid var(--border-strong);
  color: var(--text-primary); font-size: 11.5px; padding: 6px 10px; border-radius: var(--radius-sm);
  pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4); max-width: 220px;
}
.wos-tooltip.visible{ opacity: 1; transform: translateY(0); }

/* ---- Modal ---- */
.modal-overlay{
  position: fixed; inset: 0; z-index: 300; background: rgba(5,6,8,0.6); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity var(--dur-med) var(--ease);
}
.modal-overlay.open{ opacity: 1; pointer-events: auto; }
.modal-box{
  background: var(--surface-elevated); border: 1px solid var(--border-strong); border-radius: var(--radius-lg);
  width: 400px; max-width: 90vw; padding: 22px 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  transform: translateY(10px) scale(0.98); transition: transform var(--dur-med) var(--ease);
}
.modal-overlay.open .modal-box{ transform: translateY(0) scale(1); }
.modal-title{ font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.modal-body{ font-size: 12.5px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.55; }
.modal-actions{ display: flex; justify-content: flex-end; gap: 8px; }

/* ---- Context menu ---- */
.context-menu{
  position: fixed; z-index: 250; min-width: 170px; background: var(--surface-elevated);
  border: 1px solid var(--border-strong); border-radius: var(--radius-md); padding: 5px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  opacity: 0; transform: scale(0.97); pointer-events: none; transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
  transform-origin: top left;
}
.context-menu.open{ opacity: 1; transform: scale(1); pointer-events: auto; }
.context-menu-item{
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12.5px;
  color: var(--text-primary); border-radius: var(--radius-sm); transition: background var(--dur-fast) var(--ease);
}
.context-menu-item:hover{ background: rgba(91,141,239,0.1); }
.context-menu-item.danger{ color: #e9b6b1; }
.context-menu-divider{ height: 1px; background: var(--border); margin: 4px 2px; }

/* ---- Floating panel (popover) ---- */
.floating-panel{
  position: fixed; z-index: 220; background: var(--surface-elevated); border: 1px solid var(--border-strong);
  border-radius: var(--radius-md); padding: 12px 14px; font-size: 12px; color: var(--text-secondary);
  box-shadow: 0 14px 36px rgba(0,0,0,0.45); max-width: 240px;
  opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
.floating-panel.open{ opacity: 1; transform: translateY(0); pointer-events: auto; }

/* ---- Command Palette ---- */
.cmdk-overlay{
  position: fixed; inset: 0; z-index: 400; background: rgba(5,6,8,0.65); backdrop-filter: blur(6px);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh;
  opacity: 0; pointer-events: none; transition: opacity var(--dur-med) var(--ease);
}
.cmdk-overlay.open{ opacity: 1; pointer-events: auto; }
.cmdk-box{

  transform: translateY(-8px) scale(0.98); transition: transform var(--dur-med) var(--ease);
}
.cmdk-overlay.open .cmdk-box{ transform: translateY(0) scale(1); }
.cmdk-input-row{ display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.cmdk-input-row svg{ width: 16px; height: 16px; color: var(--text-tertiary); flex-shrink: 0; }
.cmdk-input{ flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 14px; }
.cmdk-input:focus{ outline: none; }
.cmdk-list{ max-height: 340px; overflow-y: auto; padding: 6px; }
.cmdk-item{
  display: flex; align-items: center; justify-content: space-between; padding: 10px 12px;
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text-primary); cursor: pointer;

.cmdk-item.selected{ background: rgba(91,141,239,0.12); }

.cmdk-empty{ padding: 26px 18px; text-align: center; font-size: 12.5px; color: var(--text-tertiary); }
.cmdk-footer{ display:flex; gap:14px; padding: 9px 18px; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }
.cmdk-footer kbd{ border: 1px solid var(--border-strong); border-radius: 3px; padding: 1px 5px; margin-right: 4px; }

/* Responsive */
@media (max-width: 980px){
  .grid-dashboard{ grid-template-columns: repeat(2, 1fr); }
  .span-2{ grid-column: span 2; }
  .search-wrap{ width: 220px; }

  .viewport{ padding: 20px; }

@media(max-width:1100px){.atlas-transition{grid-template-columns:repeat(2,minmax(0,1fr))}.atlas-stage:not(:last-child)::after{display:none}}

/* ============================================================
   2. STATE STORE  (single source of truth + pub/sub)
   ============================================================ */
const STORAGE_KEY = 'wos_state_v1';
const SCHEMA_VERSION = 1;

function defaultState(){
  return {
    meta:{ schemaVersion: SCHEMA_VERSION, firstOpened: Date.now(), lastOpened: Date.now(), visitDates: [] },
    progress:{ sectionsVisited: [], topicsCompleted: [] },
    bookmarks: [],
    notes: {},
    recentlyViewed: [],
    planner:{
      vision:{ text:'' },
      goals:{ annual: [], quarterly: [] },
      careerRoadmap: [], businessRoadmap: [], investmentPlan: [],
      opportunityTracker: [], ideaVault: [], decisionJournal: [],
      skillTracker: [], readingTracker: []
    },
    simulator:{ lastInputs: null, lastRecommendation: null },
    settings:{ theme:'dark', reducedMotion: false }
  };
}

function loadState(){
  let raw;
  try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){ raw = null; }
  if(!raw || typeof raw !== 'object'){ return defaultState(); }
  if(!raw.meta || raw.meta.schemaVersion !== SCHEMA_VERSION){
    // Phase 1: no migrations defined yet — merge onto defaults conservatively
    const merged = defaultState();
    Object.keys(raw).forEach(k => { if(merged[k] !== undefined) merged[k] = Object.assign({}, merged[k], raw[k]); });
    return merged;
  }
  const merged = defaultState();
  return Object.assign(merged, raw, { meta: Object.assign(merged.meta, raw.meta) });
}

const WOS = {
  state: loadState(),
  _subscribers: [],
  subscribe(fn){ this._subscribers.push(fn); return () => { this._subscribers = this._subscribers.filter(f=>f!==fn); }; },
  notify(){ this._subscribers.forEach(fn => { try{ fn(this.state); }catch(e){ console.error(e); } }); },
  set(path, value){
    const parts = path.split('.');
    let obj = this.state;
    for(let i=0;i<parts.length-1;i++){ obj = obj[parts[i]]; }
    obj[parts[parts.length-1]] = value;
    this.notify();
    saveStateDebounced();
  },
  get(path){
    return path.split('.').reduce((o,k)=> (o==null?o:o[k]), this.state);
  }
};

let saveTimer = null;
function saveStateDebounced(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(WOS.state)); }
    catch(e){ console.error('WOS: failed to persist state', e); showToast('Could not save — storage may be full.'); }
  }, 250);
}

window.addEventListener('storage', (e)=>{
  if(e.key!==STORAGE_KEY || !e.newValue) return;
  try{
    WOS.state=validateImportedState(JSON.parse(e.newValue));
    WOS.notify();
    // IMPORTANT: do not call normal router tracking here. A router pass writes
    // visit telemetry back to localStorage, which can ping-pong between tabs.
    router({skipTracking:true, preserveAnimation:true});
  }catch(err){ /* ignore malformed external state */ }
});


/* ============================================================
   3. GLOBAL SEARCH INDEX  (engine-level, content-agnostic)
   ============================================================ */
const SearchIndex = {
  _entries: [],
  register(entry){
    // entry: { id, title, type, tags:[], slug, category }
    this._entries = this._entries.filter(e => e.id !== entry.id);
    this._entries.push(entry);
  },
  registerMany(entries){ entries.forEach(e => this.register(e)); },
  query(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return [];
    return this._entries
      .map(e => ({ e, score: scoreMatch(e, q) }))
      .filter(r => r.score > 0)
      .sort((a,b)=> b.score - a.score)
      .slice(0, 8)
      .map(r => r.e);
  }
};

function scoreMatch(entry, q){
  let score = 0;
  const title = entry.title.toLowerCase();
  if(title === q) score += 100;
  else if(title.startsWith(q)) score += 60;
  else if(title.includes(q)) score += 35;
  if(entry.category && entry.category.toLowerCase().includes(q)) score += 15;
  (entry.tags||[]).forEach(t => { if(t.toLowerCase().includes(q)) score += 10; });
  return score;
}

})));

// ---- Schema normalizer: every record gets the same shape ----
function normalizeRecord(raw){
  return Object.assign({
    id: raw.id,
    slug: raw.slug || raw.id,
    type: raw.type,
    title: raw.title || 'Untitled',
    category: raw.category || '',
    tags: raw.tags || [],
    difficulty: raw.difficulty || 'intermediate',
    estReadingTime: raw.estReadingTime || estimateReadingTime(raw.body),
    body: raw.body || [],
    relatedIds: raw.relatedIds || [],
    prerequisites: raw.prerequisites || [],
    lastUpdated: raw.lastUpdated || new Date().toISOString().slice(0,10)
  }, raw);
}

function estimateReadingTime(blocks){
  if(!blocks || !blocks.length) return 3;
  const words = blocks.reduce((sum,b)=> sum + ((b.text||b.items||[]).toString().split(/\s+/).length), 0);
  return Math.max(2, Math.round(words/180));
}

// ---- KnowledgeBase: indexes + relationship graph ----
const KnowledgeBase = {
  records: {},           // id -> normalized record
  _byType: {},            // type -> [id,...]
  _byCategory: {},        // category -> [id,...]
  _byTag: {},              // tag -> [id,...]
  graph: {},              // id -> Set(relatedId)   forward edges
  backlinks: {},          // id -> Set(id)           reverse edges

  register(raw){
    const record = normalizeRecord(raw);
    this.records[record.id] = record;

    (this._byType[record.type] = this._byType[record.type] || []).push(record.id);
    if(record.category) (this._byCategory[record.category] = this._byCategory[record.category] || []).push(record.id);
    record.tags.forEach(t => (this._byTag[t] = this._byTag[t] || []).push(record.id));

    this.graph[record.id] = this.graph[record.id] || new Set();
    (record.relatedIds || []).forEach(rid => {
      this.graph[record.id].add(rid);
      this.backlinks[rid] = this.backlinks[rid] || new Set();
      this.backlinks[rid].add(record.id);
    });

    const section = TYPE_SECTION_MAP[record.type];
    SearchIndex.register({
      id: record.id, title: record.title, type: record.type,
      slug: record.slug, category: record.category, tags: record.tags,
      route: section ? section + '/' + record.slug : record.slug
    });
  },
  registerMany(list){ list.forEach(r => this.register(r)); },

  get(id){ return this.records[id]; },
  findBySlug(type, slug){
    return (this._byType[type]||[]).map(id=>this.records[id]).find(r=>r.slug===slug);
  },
  getByType(type){ return (this._byType[type]||[]).map(id=>this.records[id]); },
  getByCategory(cat){ return (this._byCategory[cat]||[]).map(id=>this.records[id]); },

  // resolves an id's forward relations into real records the person can navigate to,
  // silently dropping any relatedIds that don't (yet) point to a registered record
  getRelated(id){
    return Array.from(this.graph[id]||[]).map(rid=>this.records[rid]).filter(Boolean);
  },
  getBacklinks(id){
    return Array.from(this.backlinks[id]||[]).map(bid=>this.records[bid]).filter(Boolean);
  }
};

// ---- Generic block-based body renderer ----
// A record's `body` is a list of typed blocks. The Engine renders any
// block type below regardless of which domain module produced it.
function renderBlocks(blocks){
  const wrap = el('<div class="kp-body"></div>');
  (blocks||[]).forEach(b=>{
    let node;
    switch(b.type){
      case 'heading':   node = el(`<h3 style="font-size:15px;margin:22px 0 8px 0;">${b.text}</h3>`); break;
      case 'paragraph':  node = el(`<p style="font-size:13px;line-height:1.7;color:var(--text-secondary);margin-bottom:12px;">${b.text}</p>`); break;
      case 'list':       node = el(`<ul style="margin:0 0 14px 18px;font-size:13px;color:var(--text-secondary);line-height:1.8;">${(b.items||[]).map(i=>`<li>${i}</li>`).join('')}</ul>`); break;
      case 'quote':      node = el(`<div style="border-left:2px solid var(--border-strong);padding:2px 0 2px 14px;margin:14px 0;font-size:13px;color:var(--text-secondary);font-style:italic;">${b.text}</div>`); break;
      case 'stat':       node = UI.MetricCard({ label: b.label, value: b.value, sub: b.sub||'' }); node.style.marginBottom='12px'; break;
      case 'statrow':    node = el('<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;"></div>'); (b.items||[]).forEach(it=> node.appendChild(UI.MetricCard({ label:it.label, value:it.value, sub:it.sub||'' }))); break;
      case 'callout':    node = UI.InsightCard({ title: b.title||'', body: b.text, tone: b.tone||'blue' }); node.style.margin='14px 0'; break;
      case 'divider':    node = el(`<hr style="border:none;border-top:1px solid var(--border);margin:18px 0;">`); break;
      default:           node = el(`<p style="font-size:13px;color:var(--text-tertiary);">${b.text||''}</p>`);
    }
    wrap.appendChild(node);
  });
  return wrap;
}

const DIFFICULTY_TONE = { beginner:'green', intermediate:'blue', advanced:'gold' };

// ---- Generic KnowledgePanel: renders any single content record ----
function renderKnowledgePanel(record){
  const tone = DIFFICULTY_TONE[record.difficulty] || 'blue';
  const panel = el(`
    <div>
      <div class="page-header">
        <div class="page-eyebrow">${record.category || record.type}</div>
        <h1 class="page-title">${record.title}</h1>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
          <span class="badge"><span class="badge-dot dot-${tone}"></span>${record.difficulty}</span>
          <span class="badge">${record.estReadingTime} min read</span>
          <span class="badge">Updated ${record.lastUpdated}</span>
        </div>
      </div>
    </div>
  `);
  const prereqRecords = (record.prerequisites||[]).map(id=>KnowledgeBase.get(id)).filter(Boolean);
  if(prereqRecords.length){
    const preWrap = el('<div style="margin-bottom:22px;font-size:12px;color:var(--text-secondary);"></div>');
    preWrap.innerHTML = 'Suggested before this: ';
    prereqRecords.forEach((p,i)=>{
      const sectionId = TYPE_SECTION_MAP[p.type];
      const link = el(`<a href="#/${sectionId}/${p.slug}" style="color:var(--accent-blue);">${p.title}</a>`);
      preWrap.appendChild(link);
      if(i < prereqRecords.length-1) preWrap.appendChild(el('<span>, </span>'));
    });
    panel.appendChild(preWrap);
  }
  panel.appendChild(renderBlocks(record.body));
  return panel;
}

// ---- Generic ListView: grid of KnowledgeCards for a set of records ----
function renderListView(records, sectionId){
  const grid = el('<div class="grid" style="grid-template-columns:repeat(2,1fr);"></div>');
  records.forEach(r=>{
    const card = UI.KnowledgeCard({ eyebrow: r.category || r.type, title: r.title, desc: (r.body[0] && r.body[0].text) ? truncate(r.body[0].text, 90) : '' });
    card.addEventListener('click', ()=> navigate(sectionId + '/' + r.slug));
    attachRowContextMenu(card, { id: r.id, title: r.title, type: r.type, route: sectionId + '/' + r.slug });
    grid.appendChild(card);
  });
  return grid;
}
function truncate(str, n){ return str.length > n ? str.slice(0,n).replace(/\s+\S*$/,'') + '…' : str; }

function renderWealthLandscape(root, section){
  const records=KnowledgeBase.getByType('wealthEngine');
  const categories=['All',...Array.from(new Set(records.map(r=>r.category)))];
  root.innerHTML=`<div class="page-header"><div class="page-eyebrow">Knowledge · Master Map</div><h1 class="page-title">Wealth Landscape</h1><p class="page-desc">The economic map connecting earning power, business creation, technology, ownership, investing and compounding into one system.</p></div>
  <div class="card" style="margin-bottom:14px"><div class="card-label">THE WEALTH CREATION LOOP</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px">${[['EARN','Human capital + career capital'],['BUILD','Businesses + technology + IP'],['OWN','Equity + productive assets'],['INVEST','Financial + private capital'],['COMPOUND','Skills + capital + optionality']].map((x,i)=>`<div style="padding:14px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)"><div style="font-size:11px;color:var(--text-tertiary)">0${i+1}</div><div style="font-weight:700;margin-top:5px">${x[0]}</div><div style="font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:5px">${x[1]}</div></div>`).join('')}</div><div style="font-size:12px;color:var(--text-tertiary);margin-top:10px">The loop is not linear: ownership can create income, income can fund ownership, and technology can amplify every stage.</div></div>
  <div class="card" style="margin-bottom:14px"><div class="card-label">MASTER ECONOMIC MAP</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.65;margin:6px 0 14px">Use Fit, Zoom and Fullscreen to inspect the complete graph. Each engine links into pathways, industries, models, skills, cases and frameworks.</div><div id="wl-graph"></div></div>
  <div class="card" style="margin-bottom:14px"><div class="card-label">2026 MARKET LENS</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin-top:6px"><strong>AI:</strong> value is spreading across applications, models, compute, energy and physical infrastructure. <strong>Private capital:</strong> liquidity, valuation and operational value creation matter more. <strong>Portfolios:</strong> personalization and global diversification are rising priorities. <strong>India:</strong> household financialization and passive investing continue to broaden market-linked wealth creation.</div></div>
  <div class="card"><div class="card-label">WEALTH ENGINES</div><div id="wl-controls" style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px"></div><div id="wl-grid" class="grid"></div></div>`;
  root.querySelector('#wl-graph').appendChild(UI.ConstellationView({records,sectionId:'landscape',width:1120,height:620}));
  const controls=root.querySelector('#wl-controls'),grid=root.querySelector('#wl-grid');let active='All';
  function paint(){controls.innerHTML='';categories.forEach(c=>controls.appendChild(UI.Button({label:c,variant:c===active?'primary':'secondary',onClick:()=>{active=c;paint()}})));grid.innerHTML='';records.filter(r=>active==='All'||r.category===active).forEach(r=>{const card=el(`<div class="card" style="cursor:pointer"><div class="card-label">${r.category}</div><div style="font-size:17px;font-weight:650;margin-top:5px">${r.title}</div><div style="font-size:13px;color:var(--text-secondary);line-height:1.6;margin-top:7px">${truncate(r.body?.[0]?.text||'',155)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:9px">${(r.tags||[]).slice(0,4).map(t=>`<span class="badge">${t}</span>`).join('')}</div></div>`);card.addEventListener('click',()=>navigate('landscape/'+r.slug));grid.appendChild(card)})}paint();
}

  {type:'callout',tone:'green',title:'Wealth OS lens',text:'Income pays for the present. Ownership can create claims on future productivity and scale.'}]},
 {id:'ownership-debt',slug:'debt-and-leverage',type:'ownershipCapital',title:'Debt & Leverage',category:'Ownership',difficulty:'advanced',tags:['debt','leverage','interest','default','refinancing'],relatedIds:[],body:[
  {type:'paragraph',text:'Debt can accelerate asset acquisition or business growth by bringing future cash flows forward, but it also creates fixed obligations that can convert ordinary volatility into insolvency risk.'},
  {type:'heading',text:'Study checklist'},
  {type:'list',items:['Debt service','Interest coverage','LTV','DSCR','Covenants','Maturity walls','Refinancing risk','Fixed versus floating rates','Recourse','Default and recovery']},
  {type:'callout',tone:'red',title:'Rule',text:'Leverage is a financing tool, not a return generator by itself. The asset economics must support the debt through adverse scenarios.'}]},
 {id:'ownership-ip',slug:'intellectual-property-capital',type:'ownershipCapital',title:'IP as Capital',category:'Ownership',difficulty:'advanced',tags:['ip','patents','software','copyright','royalties'],relatedIds:['engine-intellectual-property','concept-equity','model-licensing-royalties'],body:[
  {type:'paragraph',text:'Intellectual property can create ownership claims that scale beyond direct labor. Its economic value depends on enforceability, differentiation, distribution and the ability to license or commercialize it.'},
  {type:'heading',text:'Study checklist'},
  {type:'list',items:['Patents','Copyright','Trade secrets','Software IP','Licensing','Royalty structures','Enforcement','Defensibility','Commercialization','IP concentration risk']},
  {type:'callout',tone:'blue',title:'Wealth OS lens',text:'An invention is not automatically an asset. Economic value appears when the IP can be protected, distributed and monetized.'}]},
 {id:'allocation-savings-rate',slug:'savings-and-capital-formation',type:'capitalPrinciple',title:'Savings Rate & Capital Formation',category:'Capital Formation',difficulty:'beginner',tags:['savings','capital','cash-flow','wealth'],relatedIds:['concept-cash-flow','concept-wealth-vs-income','engine-financial-capital','fw-capital-allocation'],body:[
  {type:'paragraph',text:'Savings converts current income into future productive capacity. Early in a wealth journey, increasing earning power and controlling fixed obligations can matter more than optimizing small differences in investment returns.'},
  {type:'heading',text:'Study checklist'},
  {type:'list',items:['Savings rate','Fixed versus variable costs','Income growth','Emergency reserves','Debt payoff','Investment contributions','Lifestyle inflation','Compounding horizon']},
  {type:'callout',tone:'green',title:'Core principle',text:'Capital formation begins when current consumption is deliberately converted into future claims on productive assets.'}]},
 {id:'allocation-concentration',slug:'concentration-and-diversification',type:'capitalPrinciple',title:'Concentration vs Diversification',category:'Capital Formation',difficulty:'advanced',tags:['concentration','diversification','conviction','risk'],relatedIds:['fw-risk-budget','asset-public-equity','asset-private-equity'],body:[
  {type:'paragraph',text:'Concentration can accelerate wealth when an investor has genuine edge, control and asymmetric upside. Diversification protects against unknown unknowns and permanent loss. The right balance depends on information quality, downside capacity and correlation.'},
  {type:'heading',text:'Study checklist'},
  {type:'list',items:['Edge assessment','Position sizing','Correlation','Downside','Liquidity','Rebalancing','Information advantage','Survival constraints']},
  {type:'callout',tone:'gold',title:'Rule',text:'Concentration without edge is gambling; diversification without understanding can become closet concentration through shared underlying risks.'}]},
 {id:'allocation-regime',slug:'regime-aware-allocation',type:'capitalPrinciple',title:'Regime-Aware Allocation',category:'Capital Formation',difficulty:'expert',tags:['regime','macro','inflation','rates','scenario'],relatedIds:['concept-inflation','fw-scenario'],body:[
  {type:'paragraph',text:'Asset behavior changes across growth, inflation, liquidity and policy regimes. Regime awareness should inform scenario analysis and risk budgets without pretending that macro forecasts can reliably time markets.'},
  {type:'heading',text:'Study checklist'},
  {type:'list',items:['Growth regimes','Inflation regimes','Liquidity conditions','Rate cycles','Credit cycles','Currency regimes','Correlation changes','Scenario matrices']},
  {type:'callout',tone:'blue',title:'2026 market lens',text:'Vanguard’s July 2026 forecasts emphasize stretched valuations, changing inflation risks and the continued diversification role of fixed income. Forecasts are inputs, not certainties.'}]}

/* ============================================================

KnowledgeBase.registerMany([
 {id:'risk-survival-liquidity',slug:'survival-liquidity',type:'risk',title:'Survival Liquidity',category:'Personal Resilience',difficulty:'beginner',tags:['liquidity','cash','emergency','resilience','survival'],relatedIds:['concept-cash-flow','engine-financial-capital','fw-barbell'],body:[{type:'paragraph',text:'Survival liquidity is the immediately accessible capital required to keep essential obligations funded through income shocks, market drawdowns, business disruption or other emergencies. It is the first line of defense against forced selling and destructive borrowing.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Essential monthly burn','Emergency-fund sizing','Income volatility','Liquidity tiers','Cash versus short-duration instruments','Access speed','Forced-sale risk','Opportunity cost','Replenishment rules','Trigger conditions']},{type:'callout',tone:'gold',title:'Wealth OS lens',text:'Liquidity is not dead capital when it prevents an irreversible mistake. The correct reserve is determined by obligations, income stability, access to credit and recovery time—not by a universal month count.'}]},
 {id:'risk-income-continuity',slug:'income-continuity',type:'risk',title:'Income Continuity & Career Risk',category:'Personal Resilience',difficulty:'intermediate',tags:['income','career-risk','employability','optionality','resilience'],relatedIds:['engine-human-capital','engine-career-capital','skill-ai-engineering','fw-reversibility'],body:[{type:'paragraph',text:'For most people, the largest economic asset is future labor income. Income continuity therefore deserves the same seriousness as portfolio diversification: maintain employability, multiple pathways and sufficient runway to avoid accepting bad decisions under pressure.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Human-capital concentration','Employability','Transferable skills','Industry cyclicality','Role redundancy risk','Professional network','Portfolio career options','Learning velocity','Income replacement runway','Career transition triggers']},{type:'callout',tone:'blue',title:'Wealth OS lens',text:'A concentrated career can be economically riskier than a diversified portfolio. Optionality in skills, geography, industry and role can function as an income hedge.'}]},
 {id:'risk-insurance-architecture',slug:'insurance-architecture',type:'risk',title:'Insurance Architecture',category:'Risk Transfer',difficulty:'intermediate',tags:['insurance','risk-transfer','liability','protection','coverage'],relatedIds:[],body:[{type:'paragraph',text:'Insurance should transfer losses whose severity could materially damage the balance sheet while avoiding unnecessary premiums for risks that can be safely self-insured. The design problem is coverage, exclusions, deductibles, limits and counterparties—not simply buying more policies.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Life coverage','Health coverage','Disability coverage','Property coverage','Liability and umbrella coverage','Business interruption','Professional liability','Deductibles','Coverage limits','Exclusions','Insurer solvency','Claims process']},{type:'callout',tone:'gold',title:'Rule',text:'Transfer catastrophic risk; retain manageable risk when the expected cost of transferring it is unattractive.'}]},
 {id:'risk-debt-service',slug:'debt-service-resilience',type:'risk',title:'Debt-Service Resilience',category:'Balance-Sheet Risk',difficulty:'advanced',tags:['debt','leverage','interest','refinancing','coverage'],relatedIds:['ownership-debt'],body:[{type:'paragraph',text:'Debt becomes dangerous when fixed obligations consume the flexibility required to absorb ordinary volatility. Resilient leverage is designed around cash-flow coverage, maturity structure, collateral, covenants and downside scenarios rather than the maximum amount a lender will provide.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Debt-service coverage','Interest coverage','Fixed versus floating rates','Maturity ladder','Refinancing risk','Covenants','Collateral','Recourse','Liquidity buffer','Stress-case cash flow','Default and recovery']},{type:'callout',tone:'red',title:'Failure mode',text:'Leverage converts a temporary fall in income or asset value into a liquidity crisis when obligations cannot be serviced or refinanced.'}]},
 {id:'risk-concentration',slug:'concentration-risk',type:'risk',title:'Concentration Risk',category:'Portfolio Risk',difficulty:'advanced',tags:['concentration','diversification','correlation','single-point-failure'],relatedIds:['allocation-concentration','fw-risk-budget'],body:[{type:'paragraph',text:'Concentration exists whenever a large share of wealth depends on one asset, employer, customer, geography, industry, factor, financing source or correlated economic outcome. Labels can conceal concentration when supposedly different assets respond to the same shock.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Employer equity','Founder ownership','Sector concentration','Geographic concentration','Currency concentration','Factor exposure','Customer concentration','Counterparty concentration','Correlation spikes','Hidden common drivers']},{type:'callout',tone:'red',title:'Wealth OS lens',text:'Diversification should be measured against economic drivers and failure modes, not merely the number of securities or accounts.'}]},
 {id:'risk-counterparty',slug:'counterparty-risk',type:'risk',title:'Counterparty & Custody Risk',category:'Financial Resilience',difficulty:'advanced',tags:['counterparty','custody','broker','bank','settlement','default'],relatedIds:['asset-digital','asset-private-credit','fw-risk-budget'],body:[{type:'paragraph',text:'A financial claim is only as robust as the institutions, legal structures and settlement mechanisms standing behind it. Counterparty risk includes default, custody failure, collateral disputes, operational failure and concentration at a single intermediary.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Custodian structure','Broker and bank exposure','Collateral','Settlement','Segregation of assets','Counterparty limits','Legal title','Operational resilience','Default waterfalls','Recovery procedures']},{type:'callout',tone:'blue',title:'Practical rule',text:'Ask not only what the asset is worth, but who owes you, who holds it, under what legal claim, and what happens if that intermediary fails.'}]},
 {id:'risk-cybersecurity',slug:'cybersecurity-and-digital-risk',type:'risk',title:'Cybersecurity & Digital Risk',category:'Technology Risk',difficulty:'advanced',tags:['cybersecurity','fraud','identity','privacy','ai','digital-risk'],relatedIds:['fw-scenario'],body:[{type:'paragraph',text:'Digital wealth and businesses expose assets to credential theft, fraud, ransomware, data compromise, account takeover and AI-enabled social engineering. Cyber resilience is therefore part of wealth preservation, not merely an IT concern.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Multi-factor authentication','Password and credential hygiene','Device security','Account recovery','Phishing and social engineering','Payment verification','Data minimization','Backups','Incident response','Vendor security','AI-enabled fraud']},{type:'callout',tone:'red',title:'2026 market lens',text:'WEF’s Global Cybersecurity Outlook 2026 identifies accelerating AI adoption, geopolitical fragmentation and widening cyber inequity as forces reshaping cyber risk. Personal and business defenses therefore need both technical controls and human verification.'}]},
 {id:'risk-fraud-controls',slug:'fraud-and-social-engineering-controls',type:'risk',title:'Fraud & Social-Engineering Controls',category:'Operational Risk',difficulty:'intermediate',tags:['fraud','social-engineering','verification','controls','scams'],relatedIds:['risk-cybersecurity','risk-counterparty','fw-failure-postmortem'],body:[{type:'paragraph',text:'Fraud controls reduce the chance that a trusted identity, process or communication channel can be manipulated into authorizing an irreversible transfer. The strongest controls slow high-value decisions without creating friction everywhere.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Out-of-band verification','Dual authorization','Payment limits','Trusted contacts','Vendor-change verification','Executive impersonation','Deepfake awareness','Recovery contacts','Transaction alerts','Incident escalation']},{type:'callout',tone:'gold',title:'Control principle',text:'Never let urgency remove verification from a high-impact transaction. AI makes convincing impersonation cheaper; independent verification becomes more valuable.'}]},
 {id:'risk-business-continuity',slug:'business-continuity',type:'risk',title:'Business Continuity & Operational Resilience',category:'Business Resilience',difficulty:'advanced',tags:['business-continuity','operations','resilience','downtime','recovery'],relatedIds:['engine-business-ownership','engine-business-formation','model-saas','fw-scenario','fw-failure-postmortem'],body:[{type:'paragraph',text:'Operational resilience is the ability to continue critical functions when people, infrastructure, suppliers, software, capital or facilities fail. A resilient business identifies its most important processes and designs recovery around acceptable downtime and data loss.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Critical business functions','Single points of failure','Recovery time objective','Recovery point objective','Backups','Redundancy','Supplier concentration','Key-person risk','Incident playbooks','Communication trees','Cash runway']},{type:'callout',tone:'blue',title:'Wealth OS lens',text:'A business is a wealth asset only while it can continue producing cash flow. Resilience protects the underlying earning machine.'}]},
 {id:'risk-key-person',slug:'key-person-and-succession-risk',type:'risk',title:'Key-Person & Succession Risk',category:'Ownership Risk',difficulty:'advanced',tags:['key-person','succession','leadership','governance','continuity'],relatedIds:['engine-business-ownership','pathway-corporate-executive','model-holding-company','fw-failure-postmortem'],body:[{type:'paragraph',text:'Businesses, partnerships and family wealth can become dependent on one person’s knowledge, relationships, authority or decision-making. Succession planning converts tacit dependence into transferable systems, governance and ownership arrangements.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Critical-person mapping','Delegation','Documentation','Second-in-command','Board governance','Buy-sell agreements','Ownership transfer','Estate coordination','Leadership pipeline','Emergency succession']},{type:'callout',tone:'gold',title:'Wealth OS lens',text:'If value disappears when one person stops working, part of the apparent asset value is actually undocumented human dependence.'}]},
 {id:'risk-geopolitical',slug:'geopolitical-and-geoeconomic-risk',type:'risk',title:'Geopolitical & Geoeconomic Risk',category:'Systemic Risk',difficulty:'advanced',tags:['geopolitics','geoeconomics','sanctions','trade','supply-chain'],relatedIds:['industry-semiconductors','industry-energy','fw-scenario'],body:[{type:'paragraph',text:'Geopolitical shocks can change trade access, tariffs, sanctions, supply chains, currencies, capital flows and the availability of critical technologies. Wealth resilience therefore requires scenario analysis for exposures that cannot be diversified away through security selection alone.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Trade restrictions','Tariffs','Sanctions','Capital controls','Supply-chain concentration','Strategic commodities','Technology controls','Currency shocks','Country exposure','Political-risk scenarios']},{type:'callout',tone:'red',title:'2026 market lens',text:'WEF’s 2026 Global Risks Report ranks geoeconomic confrontation as the top near-term global risk and highlights fragmentation, conflict and strategic competition as interacting forces.'}]},
 {id:'risk-supply-chain',slug:'supply-chain-resilience',type:'risk',title:'Supply-Chain Resilience',category:'Business Resilience',difficulty:'advanced',tags:['supply-chain','vendors','inventory','single-source','redundancy'],relatedIds:['risk-geopolitical','risk-business-continuity','industry-manufacturing','industry-semiconductors','industry-logistics-transport','fw-scenario'],body:[{type:'paragraph',text:'Supply-chain resilience balances efficiency against the cost of disruption. The correct design depends on component criticality, substitution difficulty, lead times, inventory economics, supplier concentration and geographic exposure.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Single-source components','Supplier mapping','Lead times','Safety stock','Dual sourcing','Nearshoring and localization','Critical minerals','Logistics redundancy','Supplier financial health','Substitution tests']},{type:'callout',tone:'blue',title:'Wealth OS lens',text:'The cheapest supplier is not necessarily the lowest-cost supplier when a single interruption can destroy months of cash flow.'}]},
 {id:'risk-climate-physical',slug:'climate-and-physical-risk',type:'risk',title:'Climate & Physical Asset Risk',category:'Physical & Environmental Risk',difficulty:'advanced',tags:['climate','extreme-weather','property','infrastructure','insurance'],relatedIds:['industry-energy','industry-real-estate','industry-water-utilities','fw-scenario'],body:[{type:'paragraph',text:'Physical risks from extreme weather, heat, flooding, wildfire, water stress and infrastructure disruption can affect property values, insurance costs, operating continuity and financing. The right analysis is asset- and location-specific rather than a generic climate label.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Hazard exposure','Location risk','Insurance availability','Deductibles','Replacement cost','Business interruption','Water availability','Heat stress','Infrastructure dependencies','Adaptation capex']},{type:'callout',tone:'blue',title:'2026 market lens',text:'WEF notes that extreme-weather losses are already producing more than $100 billion in annual insured losses, making physical risk relevant to both asset underwriting and insurance availability.'}]},
 {id:'risk-liquidity-mismatch',slug:'liquidity-mismatch',type:'risk',title:'Liquidity Mismatch',category:'Financial Resilience',difficulty:'expert',tags:['liquidity','illiquidity','redemptions','maturity','private-markets'],relatedIds:['asset-private-credit','portfolio-total-return','fw-risk-budget'],body:[{type:'paragraph',text:'Liquidity mismatch occurs when liabilities or investor redemption needs arrive faster than the underlying assets can be sold without severe price concessions. It is a central risk in leveraged portfolios, private assets and businesses with thin cash buffers.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Liquidity ladder','Asset liquidity tiers','Liability timing','Redemption gates','Maturity mismatch','Cash buffers','Forced-sale scenarios','Collateral calls','Private-market liquidity','Recovery time']},{type:'callout',tone:'red',title:'2026 market lens',text:'IMF’s April 2026 Global Financial Stability Report emphasizes leverage, maturity and liquidity mismatches as amplification channels that can turn shocks into forced selling and financial stress.'}]},
 {id:'risk-tail-scenarios',slug:'tail-risk-and-stress-testing',type:'risk',title:'Tail Risk & Stress Testing',category:'Scenario Risk',difficulty:'expert',tags:['tail-risk','stress-testing','scenarios','drawdown','survival'],relatedIds:['allocation-risk-budget','portfolio-total-return','fw-scenario','fw-risk-budget'],body:[{type:'paragraph',text:'Stress testing asks what happens when multiple assumptions fail together. It is designed to reveal survival constraints, liquidity gaps and hidden correlations that normal-period metrics can conceal.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Historical stress tests','Hypothetical scenarios','Reverse stress testing','Drawdown analysis','Liquidity shocks','Rate shocks','Inflation shocks','Currency shocks','Correlation spikes','Recovery periods','Scenario combinations']},{type:'callout',tone:'gold',title:'Rule',text:'A useful stress test is not the one that predicts the future; it is the one that exposes a failure mode early enough to change the system.'}]},
 {id:'risk-recovery-playbooks',slug:'recovery-playbooks',type:'risk',title:'Recovery Playbooks & Crisis Governance',category:'Operational Risk',difficulty:'advanced',tags:['recovery','crisis-management','governance','playbooks','decision-making'],relatedIds:['risk-business-continuity','risk-fraud-controls','risk-tail-scenarios','fw-failure-postmortem','fw-second-order'],body:[{type:'paragraph',text:'A crisis playbook converts panic into predefined actions. It should specify decision rights, communication, liquidity priorities, evidence collection, escalation thresholds and post-incident review.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Crisis roles','Decision authority','Escalation thresholds','Stakeholder communication','Liquidity priorities','Evidence preservation','Incident containment','External specialists','Recovery milestones','Postmortem process']},{type:'callout',tone:'blue',title:'Wealth OS lens',text:'Resilience is partly a preparation problem. The quality of decisions during a shock depends on what was designed before the shock.'}]},
 {id:'risk-legal-liability',slug:'legal-and-liability-risk',type:'risk',title:'Legal & Liability Risk',category:'Legal & Liability Risk',difficulty:'advanced',tags:['liability','contracts','litigation','regulatory'],relatedIds:['risk-insurance-architecture','risk-business-continuity','engine-business-ownership','fw-scenario'],body:[{type:'paragraph',text:'Legal and liability risk arises when contracts, negligence, regulatory obligations, intellectual property disputes or other claims can materially change the balance sheet or operating model.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Material contracts','Indemnities','Liability caps','Professional liability','Regulatory obligations','IP claims','Litigation reserves','Entity separation','Documentation','Legal review triggers']},{type:'callout',tone:'red',title:'Wealth OS lens',text:'Legal structure is part of risk architecture. A profitable asset is not resilient if one unbounded liability can overwhelm it.'}]},
 {id:'risk-identity-digital-assets',slug:'identity-and-digital-asset-recovery',type:'risk',title:'Identity & Digital Asset Recovery',category:'Technology Risk',difficulty:'advanced',tags:['identity','digital-assets','account-recovery','custody'],relatedIds:['risk-cybersecurity','risk-counterparty','risk-fraud-controls','asset-digital'],body:[{type:'paragraph',text:'Digital wealth depends on identities, brokerages, exchanges, domains, cloud accounts and credentials. Recovery planning must distinguish legal ownership from technical access and successor recovery.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Identity inventory','Account ownership','Recovery contacts','Hardware keys','Credential escrow','Digital custody','Domain ownership','Cloud accounts','IP repositories','Succession access tests']},{type:'callout',tone:'blue',title:'Risk lens',text:'Digital wealth can be economically valuable yet operationally inaccessible. Recovery should be tested before it is needed.'}]},
 {id:'risk-ai-agent-operational',slug:'ai-agent-and-model-risk',type:'risk',title:'AI, Agent & Model Operational Risk',category:'Technology Risk',difficulty:'expert',tags:['ai','agents','model-risk','automation','governance'],relatedIds:['risk-cybersecurity','risk-business-continuity','risk-fraud-controls','industry-ai-infrastructure-data-centers-data-centers','fw-scenario'],body:[{type:'paragraph',text:'AI systems create new failure modes when models or agents can make decisions, execute actions, access sensitive data or interact with external systems. Resilience requires bounded authorization, evaluation, observability, rollback and human escalation.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Agent permissions','Approval thresholds','Model evaluation','Prompt injection','Data leakage','Tool-use controls','Audit logs','Rollback','Model drift','Third-party dependency','Incident escalation','Inference cost runaway']},{type:'callout',tone:'red',title:'2026 lens',text:'AI adoption increases productivity potential and operational attack surface. High-impact automated actions need explicit authorization and recovery controls.'}]},
 {id:'risk-health-disability',slug:'health-and-disability-income-risk',type:'risk',title:'Health, Disability & Income Shock Risk',category:'Personal Resilience',difficulty:'intermediate',tags:['health','disability','income','insurance','caregiving'],relatedIds:['risk-income-continuity','risk-insurance-architecture','risk-survival-liquidity','engine-human-capital'],body:[{type:'paragraph',text:'Health and disability events can reduce earning capacity while increasing expenses. Because human capital often dominates early net worth, protection against prolonged income loss can be more consequential than optimizing a small investment allocation.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Income replacement','Disability coverage','Health coverage','Caregiving exposure','Out-of-pocket costs','Waiting periods','Policy exclusions','Employer gaps','Emergency liquidity','Career re-entry','Family dependency']},{type:'callout',tone:'gold',title:'Wealth OS lens',text:'Protecting the ability to earn can be more valuable than protecting a portfolio when future labor income dominates net worth.'}]},
 {id:'risk-resilience-scorecard',slug:'resilience-scorecard',type:'risk',title:'Personal & Business Resilience Scorecard',category:'Resilience Architecture',difficulty:'intermediate',tags:['resilience','scorecard','liquidity','insurance','concentration','continuity'],relatedIds:['risk-survival-liquidity','risk-income-continuity','risk-insurance-architecture','risk-business-continuity','risk-concentration','risk-cybersecurity','risk-tail-scenarios'],body:[{type:'paragraph',text:'The Resilience Scorecard turns scattered safeguards into a single review. The goal is not zero risk; it is knowing where one shock could cause cascading damage and fixing the highest-consequence weaknesses first.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Liquidity runway','Income diversification','Insurance adequacy','Debt resilience','Asset concentration','Counterparty concentration','Cyber controls','Business continuity','Succession','Geopolitical exposure','Physical risk','Stress-test coverage']},{type:'callout',tone:'green',title:'Operating principle',text:'Review resilience before increasing risk. A larger opportunity is only useful if the downside remains survivable.'}]}
]);
