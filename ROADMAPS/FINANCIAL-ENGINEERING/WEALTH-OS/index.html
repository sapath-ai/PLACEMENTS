KnowledgeBase.registerMany([
 {id:'tax-after-tax-wealth',slug:'tax-after-tax-wealth',type:'taxLegal',title:'After-Tax Wealth',category:'Tax Architecture',difficulty:'beginner',tags:['tax', 'after-tax-return', 'cash-flow', 'wealth'],relatedIds:['allocation-tax-aware','risk-survival-liquidity'],body:[{type:'paragraph',text:'Wealth compounds from what remains after taxes, fees, losses and friction. Compare economic outcomes after applicable taxes rather than headline returns alone.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Pre-tax versus after-tax return', 'Tax drag', 'Realized versus unrealized gains', 'Income tax', 'Capital gains', 'Dividend taxation', 'Tax timing', 'Fees', 'Record keeping', 'Scenario analysis']},{type:'callout',tone:'blue',title:'Boundary',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'tax-income-character',slug:'tax-income-character',type:'taxLegal',title:'Income Character & Taxation',category:'Tax Architecture',difficulty:'intermediate',tags:['salary', 'business-income', 'capital-gains', 'dividends', 'tax'],relatedIds:['engine-human-capital','engine-business-ownership','asset-public-equity'],body:[{type:'paragraph',text:'Different economic returns can receive different tax treatment. Identify whether cash comes from employment, business operations, interest, dividends, capital appreciation, royalties or other sources.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Employment income', 'Business income', 'Interest', 'Dividends', 'Capital gains', 'Rental income', 'Royalties', 'Withholding', 'Loss offsets', 'Holding periods']},{type:'callout',tone:'blue',title:'Boundary',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'tax-equity-compensation',slug:'tax-equity-compensation',type:'taxLegal',title:'Equity Compensation & Tax',category:'Tax Architecture',difficulty:'advanced',tags:['equity-compensation', 'rsu', 'options', 'esop', 'capital-gains'],relatedIds:['pathway-staff-principal-engineer','risk-concentration'],body:[{type:'paragraph',text:'Equity compensation combines employment income, ownership exposure, vesting, liquidity constraints and tax events. Grant value alone is not economic value.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Vesting', 'Cliffs', 'Options versus restricted equity', 'Exercise mechanics', 'Taxable events', 'Withholding', 'Concentration', 'Liquidity windows', 'Dilution', 'Scenario valuation', 'Exit constraints']},{type:'callout',tone:'blue',title:'Risk lens',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'tax-business-entity',slug:'tax-business-entity',type:'taxLegal',title:'Business Entity & Tax Architecture',category:'Tax Architecture',difficulty:'advanced',tags:['company', 'llp', 'partnership', 'entity', 'tax', 'structure'],relatedIds:['model-holding-company','engine-business-ownership','engine-business-formation'],body:[{type:'paragraph',text:'Entity choice can affect liability, governance, tax administration, financing, ownership transfer and succession. Structure depends on the business, owners and jurisdiction.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Sole proprietorship', 'Partnerships', 'LLPs', 'Companies', 'Holding structures', 'Operating subsidiaries', 'Intercompany arrangements', 'Governance', 'Compliance burden', 'Financing implications', 'Exit implications']},{type:'callout',tone:'blue',title:'Boundary',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'tax-asset-location',slug:'tax-asset-location',type:'taxLegal',title:'Tax-Aware Asset Location',category:'Tax Architecture',difficulty:'advanced',tags:['asset-location', 'tax', 'portfolio', 'accounts', 'after-tax'],relatedIds:['allocation-tax-aware','asset-index-funds'],body:[{type:'paragraph',text:'Asset location asks where investments should be held when available structures have different tax consequences. It is distinct from asset allocation.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Taxable accounts', 'Tax-advantaged accounts', 'Interest-bearing assets', 'Equity exposure', 'Turnover', 'Distribution yield', 'Capital gains timing', 'Withdrawal rules', 'Account constraints', 'After-tax optimization']},{type:'callout',tone:'blue',title:'Boundary',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'legal-contracts',slug:'legal-contracts',type:'taxLegal',title:'Contracts, Rights & Obligations',category:'Legal Architecture',difficulty:'intermediate',tags:['contracts', 'rights', 'obligations', 'liability', 'legal'],relatedIds:['risk-legal-liability','engine-business-ownership','model-saas'],body:[{type:'paragraph',text:'Contracts allocate economic rights, obligations, risk and control. Analyze who owns upside, bears downside and what obligations survive breach or ownership change.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Parties and authority', 'Scope', 'Payment terms', 'Representations', 'Warranties', 'Indemnities', 'Liability caps', 'Termination', 'IP ownership', 'Confidentiality', 'Dispute resolution']},{type:'callout',tone:'blue',title:'Rule',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'legal-intellectual-property',slug:'legal-intellectual-property',type:'taxLegal',title:'Intellectual Property Ownership',category:'Legal Architecture',difficulty:'advanced',tags:['ip', 'patents', 'copyright', 'trade-secrets', 'licensing'],relatedIds:['engine-intellectual-property','risk-legal-liability','model-licensing-royalties'],body:[{type:'paragraph',text:'IP becomes a durable wealth asset only when ownership, scope, evidence, licensing rights and transferability are clear.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Patents', 'Copyright', 'Trademarks', 'Trade secrets', 'Employee invention clauses', 'Contractor IP assignment', 'Licensing rights', 'Territory', 'Duration', 'Enforcement', 'Chain of title']},{type:'callout',tone:'blue',title:'Wealth OS lens',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'legal-governance',slug:'legal-governance',type:'taxLegal',title:'Ownership, Governance & Control',category:'Legal Architecture',difficulty:'advanced',tags:['governance', 'shareholders', 'control', 'voting', 'board'],relatedIds:['engine-business-ownership','model-holding-company','risk-key-person'],body:[{type:'paragraph',text:'Ownership percentage does not always equal control. Voting rights, boards, shareholder agreements and preferences determine decision rights and value distribution.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Voting rights', 'Board rights', 'Share classes', 'Preferred economics', 'Protective provisions', 'Shareholder agreements', 'Reserved matters', 'Deadlock', 'Transfer restrictions', 'Change of control', 'Fiduciary duties']},{type:'callout',tone:'blue',title:'Operating principle',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-will',slug:'succession-will',type:'taxLegal',title:'Will & Basic Estate Plan',category:'Succession Architecture',difficulty:'beginner',tags:['will', 'estate', 'succession', 'beneficiaries', 'legacy'],relatedIds:['risk-key-person','tax-after-tax-wealth'],body:[{type:'paragraph',text:'A basic estate plan makes intentions explicit for assets, beneficiaries, guardianship and decision-making. Keep it synchronized with nominations, ownership and local law.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Will', 'Executor', 'Beneficiaries', 'Guardianship', 'Asset inventory', 'Nomination review', 'Digital assets', 'Business interests', 'Document storage', 'Periodic review']},{type:'callout',tone:'blue',title:'Boundary',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-trusts',slug:'succession-trusts',type:'taxLegal',title:'Trusts & Wealth Structures',category:'Succession Architecture',difficulty:'advanced',tags:['trusts', 'estate', 'succession', 'asset-protection', 'governance'],relatedIds:['risk-legal-liability','model-holding-company'],body:[{type:'paragraph',text:'Trusts can separate legal ownership, beneficial interests, governance and succession objectives. Their usefulness depends heavily on jurisdiction, tax treatment and control.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Settlor', 'Trustee', 'Beneficiaries', 'Discretionary versus fixed interests', 'Control rights', 'Distribution rules', 'Tax treatment', 'Asset protection limits', 'Administration', 'Trust governance', 'Termination']},{type:'callout',tone:'blue',title:'Boundary',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-business',slug:'succession-business',type:'taxLegal',title:'Business Succession Planning',category:'Succession Architecture',difficulty:'advanced',tags:['succession', 'family-business', 'ownership-transfer', 'leadership', 'continuity'],relatedIds:['risk-key-person','engine-business-ownership','model-holding-company'],body:[{type:'paragraph',text:'Business succession aligns ownership transfer, management continuity, valuation, financing and family governance. It should work even if the triggering event occurs earlier than expected.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Successor identification', 'Management continuity', 'Ownership transfer', 'Valuation', 'Buy-sell mechanisms', 'Funding', 'Voting control', 'Family governance', 'Key-person coverage', 'Emergency succession', 'Communication plan']},{type:'callout',tone:'blue',title:'Wealth OS lens',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-digital',slug:'succession-digital',type:'taxLegal',title:'Digital Asset Estate Planning',category:'Succession Architecture',difficulty:'advanced',tags:['digital-assets', 'crypto', 'accounts', 'credentials', 'estate'],relatedIds:['risk-identity-digital-assets','risk-cybersecurity','asset-digital'],body:[{type:'paragraph',text:'Digital assets require an estate plan that distinguishes legal ownership from technical access. Successors may have a legal claim yet lack the recovery path to administer assets.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Asset inventory', 'Custody', 'Recovery contacts', 'Key governance', 'Brokerage access', 'Domain ownership', 'Cloud accounts', 'Social accounts', 'Business repositories', 'Access instructions', 'Privacy boundaries']},{type:'callout',tone:'blue',title:'Operating principle',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-cross-border',slug:'succession-cross-border',type:'taxLegal',title:'Cross-Border Wealth & Succession',category:'Cross-Border Architecture',difficulty:'expert',tags:['cross-border', 'tax', 'residency', 'inheritance', 'succession', 'compliance'],relatedIds:['risk-geopolitical','risk-legal-liability'],body:[{type:'paragraph',text:'Cross-border wealth can encounter multiple tax systems, inheritance regimes, reporting requirements, exchange controls, treaty rules and different legal definitions of ownership.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Tax residence', 'Domicile concepts', 'Inheritance rules', 'Gift rules', 'Treaties', 'Foreign-asset reporting', 'Exchange controls', 'Entity recognition', 'Trust recognition', 'Currency exposure', 'Professional coordination']},{type:'callout',tone:'blue',title:'2026 market lens',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-family-governance',slug:'succession-family-governance',type:'taxLegal',title:'Family Governance & Wealth Transfer',category:'Succession Architecture',difficulty:'advanced',tags:['family-governance', 'wealth-transfer', 'family-office', 'values', 'succession'],relatedIds:['risk-key-person'],body:[{type:'paragraph',text:'Intergenerational wealth transfer is partly a governance problem. Decision rights, education, conflict resolution and responsibilities matter alongside legal documents.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Family constitution', 'Values and mission', 'Education', 'Decision rights', 'Family council', 'Conflict resolution', 'Beneficiary expectations', 'Philanthropy', 'Investment governance', 'Next-generation preparation', 'Review cadence']},{type:'callout',tone:'blue',title:'Wealth OS lens',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-philanthropy',slug:'succession-philanthropy',type:'taxLegal',title:'Philanthropy & Legacy Architecture',category:'Succession Architecture',difficulty:'intermediate',tags:['philanthropy', 'legacy', 'charity', 'giving', 'governance'],relatedIds:['succession-family-governance'],body:[{type:'paragraph',text:'Philanthropy can be integrated into long-term wealth and family governance without confusing charitable objectives with investment objectives.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Giving objectives', 'Vehicles', 'Governance', 'Grant criteria', 'Due diligence', 'Family participation', 'Tax treatment', 'Impact measurement', 'Perpetuity versus spend-down', 'Succession of control']},{type:'callout',tone:'blue',title:'Operating principle',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'succession-review',slug:'succession-review',type:'taxLegal',title:'Wealth Structure Review Cycle',category:'Governance & Review',difficulty:'intermediate',tags:['review', 'governance', 'estate', 'tax', 'succession', 'maintenance'],relatedIds:['succession-will','succession-trusts','succession-business','tax-business-entity','risk-resilience-scorecard'],body:[{type:'paragraph',text:'Tax, legal and succession structures decay when life, ownership, residency, family relationships, businesses and laws change. A review cycle keeps documents and economic reality synchronized.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Annual review', 'Life-event triggers', 'New accounts', 'New entities', 'Ownership changes', 'Residency changes', 'Beneficiary changes', 'Law changes', 'Business transactions', 'Digital-asset changes', 'Document version control']},{type:'callout',tone:'blue',title:'Operating principle',text:'Tax, legal and succession decisions are jurisdiction-specific. Use the Wealth OS for concepts and decision structure, not individualized professional advice.'}]},
 {id:'tax-gifting',slug:'gifting-and-wealth-transfer',type:'taxLegal',title:'Gifting & Lifetime Wealth Transfer',category:'Tax Architecture',difficulty:'advanced',tags:['gifting','wealth-transfer','tax','beneficiaries','estate'],relatedIds:['succession-will','succession-trusts','succession-family-governance'],body:[{type:'paragraph',text:'Lifetime transfers can shift ownership, control and economic resources before death. Their consequences depend on donor intent, recipient circumstances, valuation, tax rules, documentation and governance.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Gift objectives','Direct gifts','Conditional gifts','Valuation','Gift-tax concepts','Documentation','Beneficiary fairness','Control versus benefit','Trust transfers','Cross-border gifts','Record keeping']},{type:'callout',tone:'blue',title:'Boundary',text:'Transfer strategies are jurisdiction-specific. Study the mechanics before considering implementation with qualified advisers.'}]},
 {id:'legal-incapacity',slug:'incapacity-and-decision-authority',type:'taxLegal',title:'Incapacity & Decision Authority',category:'Legal Architecture',difficulty:'intermediate',tags:['incapacity','power-of-attorney','governance','continuity'],relatedIds:['succession-will','risk-key-person','risk-identity-digital-assets'],body:[{type:'paragraph',text:'Succession planning must address incapacity as well as death. The system needs lawful decision authority for finances, businesses, property and digital administration when an owner cannot act.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Powers of attorney','Healthcare directives','Financial authority','Business signing authority','Emergency contacts','Capacity triggers','Substitute decision-makers','Digital access','Document storage','Review triggers']},{type:'callout',tone:'gold',title:'Wealth OS lens',text:'A plan that works only after death is incomplete if incapacity can freeze the same assets earlier.'}]},
 {id:'succession-probate',slug:'probate-and-estate-administration',type:'taxLegal',title:'Probate & Estate Administration',category:'Succession Architecture',difficulty:'advanced',tags:['probate','estate','executor','administration','liabilities'],relatedIds:['succession-will','tax-after-tax-wealth','risk-legal-liability'],body:[{type:'paragraph',text:'Estate administration converts a succession plan into an operational process: identify assets, establish authority, settle obligations, resolve claims and transfer remaining interests.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Executor authority','Asset inventory','Debt settlement','Claims','Probate concepts','Valuation dates','Tax filings','Beneficiary verification','Distribution records','Cross-border administration']},{type:'callout',tone:'blue',title:'Operating principle',text:'A legally valid intention still needs an executable administration process.'}]},
 {id:'succession-estate-liquidity',slug:'estate-liquidity-and-transfer-funding',type:'taxLegal',title:'Estate Liquidity & Transfer Funding',category:'Succession Architecture',difficulty:'advanced',tags:['estate-liquidity','insurance','debt','tax','transfer'],relatedIds:['risk-survival-liquidity','risk-insurance-architecture','succession-business'],body:[{type:'paragraph',text:'Transfers can create cash requirements from taxes, debt, administration costs, buyouts or business continuity needs. Estate liquidity planning prevents forced sales at unfavorable times.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Liquidity needs','Debts','Taxes','Administrative costs','Insurance proceeds','Asset sale timing','Business buyouts','Illiquid assets','Cash reserves','Stress scenarios']},{type:'callout',tone:'gold',title:'Wealth OS lens',text:'Transfer planning is partly a liquidity problem: ownership can change faster than illiquid assets can be monetized.'}]},
 {id:'tax-retirement-accounts',slug:'retirement-and-pension-tax-architecture',type:'taxLegal',title:'Retirement & Pension Tax Architecture',category:'Tax Architecture',difficulty:'advanced',tags:['retirement','pension','tax','withdrawals','longevity'],relatedIds:['tax-after-tax-wealth','risk-income-continuity','risk-health-disability'],body:[{type:'paragraph',text:'Retirement structures combine contribution rules, tax treatment, withdrawal constraints, longevity risk and beneficiary design. The relevant metric is sustainable after-tax lifetime cash flow, not account size alone.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Contribution rules','Employer plans','Pension income','Tax-deferred growth','Withdrawal rules','Required distributions','Beneficiary rules','Longevity risk','Inflation','Healthcare costs','After-tax retirement cash flow']},{type:'callout',tone:'blue',title:'Planning lens',text:'Retirement planning should integrate tax, liquidity, longevity and succession rather than treating the pension account as an isolated bucket.'}]},
 {id:'tax-reporting-compliance',slug:'tax-reporting-and-disclosure',type:'taxLegal',title:'Tax Reporting, Disclosure & Compliance',category:'Tax Architecture',difficulty:'advanced',tags:['tax-reporting','compliance','disclosure','foreign-assets','records'],relatedIds:['succession-cross-border','tax-business-entity','succession-review'],body:[{type:'paragraph',text:'A tax strategy is incomplete without accurate reporting, documentation and deadline management. Cross-border ownership can create additional disclosure and information-reporting obligations.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Tax returns','Information reporting','Foreign assets','Beneficial ownership','Withholding','Estimated payments','Deadlines','Records','Audit readiness','Disclosure changes','Advisor coordination']},{type:'callout',tone:'red',title:'Rule',text:'Optimization that creates non-compliance is not optimization. Documentation and reporting are part of the architecture.'}]},
 {id:'succession-beneficiary-design',slug:'beneficiary-and-nomination-design',type:'taxLegal',title:'Beneficiary & Nomination Design',category:'Succession Architecture',difficulty:'intermediate',tags:['beneficiaries','nominations','estate','accounts','succession'],relatedIds:['succession-will','succession-digital','succession-review'],body:[{type:'paragraph',text:'Beneficiary design determines who receives certain assets and can interact with account-level transfer rules that do not map neatly onto the broader estate plan. Coordination is essential.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Beneficiary designations','Nominees','Joint ownership','Account-level transfer','Primary beneficiaries','Contingent beneficiaries','Minor beneficiaries','Trust coordination','Will coordination','Review after life events']},{type:'callout',tone:'gold',title:'Failure mode',text:'An outdated account designation can undermine an otherwise carefully constructed succession plan.'}]},
 {id:'succession-dispute-governance',slug:'family-dispute-and-conflict-governance',type:'taxLegal',title:'Family Dispute & Conflict Governance',category:'Governance & Review',difficulty:'advanced',tags:['family-governance','disputes','conflict','mediation','succession'],relatedIds:['succession-family-governance','succession-business','risk-legal-liability'],body:[{type:'paragraph',text:'Wealth transfer can create disputes over control, fairness, expectations and business roles. Governance mechanisms can reduce ambiguity before conflict becomes litigation.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Conflict mapping','Family constitution','Decision rights','Mediation','Deadlock mechanisms','Independent advisers','Fairness principles','Business versus personal assets','Communication protocols','Dispute escalation']},{type:'callout',tone:'blue',title:'Governance lens',text:'The cheapest dispute is the one whose ambiguity was removed before the conflict began.'}]},
 {id:'succession-asset-titling',slug:'asset-titling-and-ownership-records',type:'taxLegal',title:'Asset Titling & Ownership Records',category:'Legal Architecture',difficulty:'intermediate',tags:['ownership','titling','records','custody','estate'],relatedIds:['legal-governance','succession-will','risk-counterparty'],body:[{type:'paragraph',text:'Legal ownership must match the intended structure. Asset titles, shareholder registers, account ownership and custody records provide the evidence that connects economic intent to enforceable rights.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Title records','Share registers','Account ownership','Joint ownership','Nominee structures','Custody records','Beneficial ownership','Entity records','Document reconciliation','Annual verification']},{type:'callout',tone:'blue',title:'Operating principle',text:'A plan cannot transfer what the records cannot clearly identify.'}]}]);

KnowledgeBase.registerMany([
 {id:'fi-financial-statements',slug:'financial-statements',type:'financialIntelligence',title:'Financial Statements Architecture',category:'Financial Statements',difficulty:'beginner',tags:['income-statement','balance-sheet','cash-flow','accounting'],relatedIds:['concept-assets-vs-liabilities','concept-net-worth','engine-financial-capital'],body:[{type:'paragraph',text:'Financial intelligence begins by understanding how the income statement, balance sheet and cash flow statement describe the same economic system from different angles.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Income statement','Balance sheet','Cash flow statement','Statement linkages','Accounting period','Accrual versus cash','Notes to accounts','Management commentary','Audit report','Comparative periods']},{type:'callout',tone:'blue',title:'Analyst lens',text:'Never read a financial statement in isolation. The useful signal comes from how earnings, assets, liabilities and cash reconcile over time.'}]},
 {id:'fi-income-statement',slug:'income-statement-analysis',type:'financialIntelligence',title:'Income Statement Analysis',category:'Financial Statements',difficulty:'intermediate',tags:['revenue','gross-margin','operating-margin','earnings'],relatedIds:['fi-financial-statements','fi-profitability-metrics'],body:[{type:'paragraph',text:'Income statement analysis decomposes revenue growth, margins, operating leverage, financing costs and taxes to determine what is driving reported earnings.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Revenue growth','Price versus volume','Gross margin','Operating expenses','EBIT','EBITDA limitations','Interest expense','Tax rate','Net income','Earnings per share','Margin bridge']},{type:'callout',tone:'blue',title:'Question',text:'Do earnings improve because the underlying economics improved, or because accounting, mix, pricing, financing or one-time effects changed?'}]},
 {id:'fi-balance-sheet',slug:'balance-sheet-analysis',type:'financialIntelligence',title:'Balance Sheet Analysis',category:'Financial Statements',difficulty:'intermediate',tags:['assets','liabilities','equity','leverage','working-capital'],relatedIds:['fi-financial-statements','risk-debt-service','fi-liquidity-metrics'],body:[{type:'paragraph',text:'The balance sheet reveals what the business owns, owes and has financed with equity at a point in time. Analysts use it to assess capital intensity, liquidity, leverage and financial flexibility.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Cash','Receivables','Inventory','PP&E','Intangibles','Payables','Debt','Lease liabilities','Equity','Working capital','Net debt']},{type:'callout',tone:'blue',title:'Balance-sheet lens',text:'Growth can consume cash. Always ask what additional assets and liabilities were required to produce the reported growth.'}]},
 {id:'fi-cash-flow',slug:'cash-flow-analysis',type:'financialIntelligence',title:'Cash Flow Analysis',category:'Cash Flow Intelligence',difficulty:'intermediate',tags:['cash-flow','operating-cash-flow','capex','free-cash-flow'],relatedIds:['fi-financial-statements','fi-free-cash-flow','risk-liquidity-mismatch'],body:[{type:'paragraph',text:'Cash flow analysis tests whether accounting earnings translate into cash and whether the business can fund operations, investment, debt service and distributions without continual external financing.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Operating cash flow','Investing cash flow','Financing cash flow','Working-capital effects','Capex','Acquisitions','Debt issuance','Debt repayment','Dividends','Cash conversion']},{type:'callout',tone:'blue',title:'2026 analyst lens',text:'CFA Institute emphasizes cash-flow analysis for liquidity, solvency, financial flexibility and valuation because investor claims are ultimately settled in cash.'}]},
 {id:'fi-free-cash-flow',slug:'free-cash-flow',type:'financialIntelligence',title:'Free Cash Flow',category:'Cash Flow Intelligence',difficulty:'advanced',tags:['fcff','fcfe','free-cash-flow','valuation'],relatedIds:['fi-cash-flow','concept-economic-value-creation','asset-public-equity'],body:[{type:'paragraph',text:'Free cash flow measures cash available after the investments required to sustain or grow the business. FCFF and FCFE connect operating economics to valuation.'},{type:'heading',text:'Study checklist'},{type:'list',items:['FCFF','FCFE','NOPAT','D&A','Capital expenditure','Working capital investment','Unlevered cash flow','Levered cash flow','Cash conversion','FCF yield','Normalization']},{type:'callout',tone:'gold',title:'Valuation bridge',text:'A business can report strong accounting earnings while producing weak free cash flow. The difference matters for intrinsic value.'}]},
 {id:'fi-profitability-metrics',slug:'profitability-metrics',type:'financialIntelligence',title:'Profitability & Return Metrics',category:'Performance Metrics',difficulty:'intermediate',tags:['gross-margin','operating-margin','roic','roe','roa'],relatedIds:['fi-income-statement','fi-dupont','concept-economic-value-creation'],body:[{type:'paragraph',text:'Profitability metrics evaluate how effectively a business converts revenue, assets and invested capital into economic returns.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Gross margin','Operating margin','Net margin','ROA','ROE','ROIC','Return on capital','NOPAT margin','Invested capital','Cost of capital']},{type:'callout',tone:'blue',title:'Core question',text:'Growth creates value when incremental returns exceed the cost of the capital required to fund that growth.'}]},
 {id:'fi-liquidity-metrics',slug:'liquidity-metrics',type:'financialIntelligence',title:'Liquidity Metrics',category:'Performance Metrics',difficulty:'intermediate',tags:['liquidity','current-ratio','quick-ratio','cash','working-capital'],relatedIds:['fi-balance-sheet','risk-survival-liquidity','risk-liquidity-mismatch'],body:[{type:'paragraph',text:'Liquidity metrics assess the ability to meet near-term obligations without disruptive financing or asset sales.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Current ratio','Quick ratio','Cash ratio','Defensive interval','Operating cash flow ratio','Working capital','Cash runway','Maturity profile','Liquidity buffer','Scenario liquidity']},{type:'callout',tone:'blue',title:'Risk lens',text:'Liquidity is about timing. A solvent company can still fail if cash arrives after obligations are due.'}]},
 {id:'fi-solvency-metrics',slug:'solvency-metrics',type:'financialIntelligence',title:'Solvency, Leverage & Coverage',category:'Performance Metrics',difficulty:'advanced',tags:['debt','leverage','interest-coverage','dscr','solvency'],relatedIds:['fi-balance-sheet','risk-debt-service','allocation-risk-budget'],body:[{type:'paragraph',text:'Solvency analysis tests the durability of a capital structure under normal and stressed operating conditions.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Debt-to-equity','Debt-to-capital','Net debt','Debt-to-EBITDA','Interest coverage','Fixed-charge coverage','DSCR','Covenants','Maturity ladder','Refinancing risk','Stress coverage']},{type:'callout',tone:'red',title:'Failure mode',text:'Leverage magnifies outcomes. Coverage ratios should be tested against weaker earnings and higher financing costs, not only current conditions.'}]},
 {id:'fi-activity-metrics',slug:'activity-and-efficiency-metrics',type:'financialIntelligence',title:'Activity & Efficiency Metrics',category:'Performance Metrics',difficulty:'intermediate',tags:['inventory','receivables','payables','asset-turnover','working-capital'],relatedIds:['fi-balance-sheet','fi-cash-flow'],body:[{type:'paragraph',text:'Efficiency metrics show how effectively the business turns working capital and assets into revenue and cash.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Inventory turnover','Days inventory','Receivables turnover','DSO','Payables turnover','DPO','Working-capital turnover','Asset turnover','Cash conversion cycle','Unit economics linkage']},{type:'callout',tone:'blue',title:'Operating lens',text:'Growth that requires disproportionately more working capital can destroy cash even while reported revenue accelerates.'}]},
 {id:'fi-dupont',slug:'dupont-analysis',type:'financialIntelligence',title:'DuPont & Return Decomposition',category:'Performance Metrics',difficulty:'advanced',tags:['dupont','roe','margin','turnover','leverage'],relatedIds:['fi-profitability-metrics','fi-solvency-metrics'],body:[{type:'paragraph',text:'DuPont analysis decomposes return on equity into operating profitability, asset efficiency and financial leverage, helping explain why ROE changed.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Net margin','Asset turnover','Equity multiplier','Three-step DuPont','Five-step DuPont','Tax burden','Interest burden','Operating margin','Leverage effects','Quality of ROE']},{type:'callout',tone:'gold',title:'Warning',text:'High ROE is not automatically high quality. Leverage can manufacture attractive equity returns while increasing failure risk.'}]},
 {id:'fi-earnings-quality',slug:'earnings-quality',type:'financialIntelligence',title:'Earnings Quality',category:'Quality of Financials',difficulty:'expert',tags:['earnings-quality','accruals','cash-flow','accounting','red-flags'],relatedIds:['fi-income-statement','fi-cash-flow','fi-reporting-quality'],body:[{type:'paragraph',text:'Earnings quality asks how faithfully reported profits represent repeatable economic performance and cash generation.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Accruals','Revenue recognition','Expense capitalization','One-time items','Operating cash flow versus net income','Receivables growth','Inventory growth','Non-GAAP adjustments','Stock compensation','Deferred revenue','Earnings persistence']},{type:'callout',tone:'red',title:'Analyst rule',text:'Reported earnings are an input, not a conclusion. Investigate the bridge from accounting profit to economic cash generation.'}]},
 {id:'fi-reporting-quality',slug:'financial-reporting-quality',type:'financialIntelligence',title:'Financial Reporting Quality & Red Flags',category:'Quality of Financials',difficulty:'expert',tags:['reporting-quality','audit','red-flags','disclosure','governance'],relatedIds:['fi-earnings-quality','fi-financial-statements','risk-legal-liability'],body:[{type:'paragraph',text:'Reporting-quality analysis evaluates whether disclosures, accounting choices and management incentives faithfully represent economic reality.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Accounting policy changes','Audit opinions','Related parties','Insider transactions','Revenue anomalies','Cash-flow classification','Asset valuation','Contingent liabilities','Management incentives','Disclosure quality','Restatements']},{type:'callout',tone:'red',title:'2026 analyst lens',text:'CFA Institute treats reporting quality and earnings quality as distinct but interrelated dimensions of financial analysis.'}]},
 {id:'fi-common-size',slug:'common-size-and-trend-analysis',type:'financialIntelligence',title:'Common-Size & Trend Analysis',category:'Analytical Methods',difficulty:'intermediate',tags:['common-size','trend','time-series','benchmarking'],relatedIds:['fi-financial-statements','fi-activity-metrics'],body:[{type:'paragraph',text:'Common-size and trend analysis normalize financial information so changes in mix, scale and structure become easier to compare across time and companies.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Vertical common-size income statement','Vertical common-size balance sheet','Horizontal analysis','Base-year indexing','Margin trends','Expense mix','Capital structure mix','Peer comparison','Benchmark selection','Trend breaks']},{type:'callout',tone:'blue',title:'Comparison principle',text:'A number becomes more informative when you know its historical trend, peer benchmark and economic driver.'}]},
 {id:'fi-kpi-tree',slug:'kpi-and-driver-trees',type:'financialIntelligence',title:'KPI & Driver Trees',category:'Business Intelligence',difficulty:'advanced',tags:['kpi','drivers','unit-economics','operating-model'],relatedIds:['fi-profitability-metrics','fi-activity-metrics','model-saas'],body:[{type:'paragraph',text:'Driver trees connect top-line outcomes to the operational variables that actually produce them. They turn dashboards from collections of numbers into causal operating systems.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Revenue drivers','Volume','Price','Conversion','Retention','Customer acquisition cost','Lifetime value','Gross margin','Capacity utilization','Headcount productivity','Cash drivers']},{type:'callout',tone:'gold',title:'Rule',text:'A KPI is useful when a decision-maker can act on its underlying driver.'}]},

 {id:'fi-segment-analysis',slug:'segment-and-geographic-analysis',type:'financialIntelligence',title:'Segment & Geographic Analysis',category:'Business Intelligence',difficulty:'advanced',tags:['segments','geography','mix','margins','growth'],relatedIds:['fi-income-statement','fi-kpi-tree','fi-common-size','industry-artificial-intelligence'],body:[{type:'paragraph',text:'Aggregate company results can hide radically different economics across products, customers, geographies and operating segments. Segment analysis identifies where growth, margin, capital intensity and risk actually reside.'},{type:'heading',text:'Study checklist'},{type:'list',items:['Segment revenue','Segment margins','Geographic growth','Product mix','Customer concentration','Capital intensity by segment','Corporate overhead','Intersegment effects','Mix shifts','Disclosure quality']},{type:'callout',tone:'blue',title:'Analyst lens',text:'The consolidated company can look healthy while a critical segment is deteriorating. Always locate the economic engine beneath the aggregate number.'}]},

function relationshipTokens(record){
  const text = [record.title, record.category, ...(record.tags||[])].join(' ').toLowerCase();
  return new Set(text.split(/[^a-z0-9+#.-]+/).filter(x=>x.length>2));
}
function relationshipScore(a,b){
  if(!a || !b || a.id===b.id) return {score:0, reasons:[]};
  const reasons=[];
  const explicit = KnowledgeBase.graph[a.id]?.has(b.id) || KnowledgeBase.graph[b.id]?.has(a.id);
  let score = explicit ? RELATIONSHIP_TYPE_WEIGHT.explicit : 0;
  if(explicit) reasons.push({type:'explicit',label:'Explicitly linked in the knowledge graph'});

  const at = new Set(a.tags||[]); const bt = new Set(b.tags||[]);
  const sharedTags = [...at].filter(t=>bt.has(t));
  if(sharedTags.length){
    score += Math.min(0.42, sharedTags.length*0.12);
    reasons.push({type:'tag',label:'Shared tags: '+sharedTags.slice(0,4).join(', ')});
  }
  if(a.category && b.category && a.category===b.category){
    score += RELATIONSHIP_TYPE_WEIGHT.category;
    reasons.push({type:'category',label:'Same category: '+a.category});
  }
  const affinity = (RELATIONSHIP_TYPE_AFFINITY[a.type]||{})[b.type] || 0;
  if(affinity){ score += affinity*RELATIONSHIP_TYPE_WEIGHT.typeAffinity; }

  const atok = relationshipTokens(a), btok = relationshipTokens(b);
  const overlap = [...atok].filter(x=>btok.has(x)).filter(x=>x.length>4);
  if(overlap.length>=2){
    score += Math.min(0.22, overlap.length*0.025);
    reasons.push({type:'semantic',label:'Shared concepts: '+overlap.slice(0,5).join(', ')});
  }
  return { score: Math.min(1,score), reasons };
}

const RelationshipEngine = {
  neighbors(id, opts={}){
    const limit = opts.limit || 8;
    const source = KnowledgeBase.get(id); if(!source) return [];
    return Object.values(KnowledgeBase.records)
      .filter(r=>r.id!==id)
      .map(r=>{ const x=relationshipScore(source,r); return {record:r,score:x.score,reasons:x.reasons}; })
      .filter(x=>x.score>= (opts.minScore||0.10))
      .sort((a,b)=>b.score-a.score)
      .slice(0,limit);
  },
  degree(id){ return this.neighbors(id,{limit:1000,minScore:0.10}).length; },
  graphStats(){
    const records=Object.values(KnowledgeBase.records);
    const edges=[]; const seen=new Set();
    records.forEach(a=>records.forEach(b=>{
      if(a.id===b.id) return;
      const key=[a.id,b.id].sort().join('|'); if(seen.has(key)) return;
      const x=relationshipScore(a,b); if(x.score>=0.22){seen.add(key);edges.push(x.score);}
    }));
    const degrees=records.map(r=>this.degree(r.id));
    return {nodes:records.length,edges:edges.length,avgDegree:degrees.length?(degrees.reduce((a,b)=>a+b,0)/degrees.length):0,isolated:degrees.filter(x=>x===0).length};
  },
  bridgeRecords(limit=6){
    return Object.values(KnowledgeBase.records).map(r=>({record:r,degree:this.degree(r.id)})).sort((a,b)=>b.degree-a.degree).slice(0,limit);
  },
  path(fromId,toId){
    if(fromId===toId) return [fromId];
    const q=[fromId], prev={[fromId]:null}, seen=new Set([fromId]);
    while(q.length){
      const cur=q.shift();
      const ns=this.neighbors(cur,{limit:1000,minScore:0.22});
      for(const n of ns){
        if(seen.has(n.record.id)) continue;
        seen.add(n.record.id); prev[n.record.id]=cur;
        if(n.record.id===toId){ const out=[]; let x=toId; while(x){out.unshift(x);x=prev[x];} return out; }
        q.push(n.record.id);
      }
    }
    return [];
  }
};

function relationshipNavigate(r){ const section=TYPE_SECTION_MAP[r.type]; if(section) navigate(section+'/'+r.slug); }
function relationshipCard(item){
  const r=item.record;
  const card=UI.KnowledgeCard({eyebrow:r.category||r.type,title:r.title,desc:item.reasons?.[0]?.label||''});
  card.addEventListener('click',()=>relationshipNavigate(r));
  UI.Tooltip.attach(card, (item.reasons||[]).map(x=>x.label).join(' • ') || 'Connected knowledge');
  return card;
}

function renderRelationshipNetwork(record){
  const neighbors=RelationshipEngine.neighbors(record.id,{limit:12,minScore:0.18});
  const records=[record,...neighbors.map(x=>x.record)];
  const panel=el('<div class="card" style="margin-top:24px;"><div class="card-label">Knowledge Graph · Context</div></div>');
  panel.appendChild(el(`<div style="font-size:13px;color:var(--text-secondary);line-height:1.65;margin:6px 0 14px;">This node connects across the Wealth OS by explicit relationships, shared tags, categories and cross-domain affinities. Stronger connections are ranked first.</div>`));
  if(records.length>1) panel.appendChild(UI.ConstellationView({records,sectionId:TYPE_SECTION_MAP[record.type]||'dashboard',width:880,height:360}));
  else panel.appendChild(el('<div class="empty-state">No sufficiently strong graph connections yet.</div>'));
  return panel;
}

function renderRelatedPanel(record){
  const neighbors=RelationshipEngine.neighbors(record.id,{limit:9,minScore:0.18});
  const wrap=el('<div style="margin-top:32px;"></div>');
  wrap.appendChild(el('<div class="card-label" style="margin-bottom:10px;">Relationship Engine</div>'));
  if(!neighbors.length){ wrap.appendChild(el('<div class="empty-state">No strong contextual relationships yet.</div>')); return wrap; }
  const grid=el('<div class="grid" style="grid-template-columns:repeat(3,1fr);"></div>');
  neighbors.forEach(x=>grid.appendChild(relationshipCard(x)));
  wrap.appendChild(grid);
  return wrap;
}

function renderRelationshipDashboard(root){
  const stats=RelationshipEngine.graphStats();
  const bridges=RelationshipEngine.bridgeRecords(6);
  const card=el('<div class="card span-2"><div class="card-label">Relationship Engine</div></div>');
  const metrics=el('<div class="grid" style="grid-template-columns:repeat(4,1fr);margin:8px 0 16px;"></div>');
  metrics.appendChild(UI.MetricCard({label:'Knowledge nodes',value:stats.nodes}));
  metrics.appendChild(UI.MetricCard({label:'Strong edges',value:stats.edges}));
  metrics.appendChild(UI.MetricCard({label:'Avg connections',value:stats.avgDegree.toFixed(1)}));
  metrics.appendChild(UI.MetricCard({label:'Isolated nodes',value:stats.isolated}));
  card.appendChild(metrics);
  const list=el('<div class="relationship-dashboard-list" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;"></div>');
  bridges.forEach(x=>{
    const row=el(`<button type="button" class="nav-item relationship-action" style="width:100%;justify-content:space-between;text-align:left;padding:8px 9px;min-height:34px;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${x.record.title}</span><span class="badge">${x.degree} links</span></button>`);
    row.addEventListener('click',()=>relationshipNavigate(x.record)); list.appendChild(row);
  });
  card.appendChild(list);
  root.appendChild(card);
}

    relatedIds:['concept-capitalism','concept-capital-allocation'],

      { type:'paragraph', text:'People and organizations respond to how they are measured and rewarded, often more powerfully than to stated goals or good intentions. Misdiagnosing a problem as a "people" problem when it is actually an incentive-design problem is one of the most common strategic errors, in business and in policy alike.' },
      { type:'heading', text:'The principal-agent problem' },
      { type:'paragraph', text:'Whenever one party (a principal) hires or empowers another (an agent) to act on their behalf, their interests are never perfectly aligned. A manager paid a fixed salary has less incentive to take a value-creating risk than an owner whose net worth depends on the outcome. Recognizing this gap — and understanding who bears the cost when it isn\'t closed — is central to reading any business or organization correctly.' },
      { type:'list', items:[
        'Sales commissions can incentivize volume over customer fit',
        'Quarterly earnings pressure can incentivize short-term profit over long-term reinvestment',
        'Equity compensation is one common tool for narrowing the principal-agent gap by giving agents a direct stake in outcomes'
      ]},
      { type:'callout', tone:'blue', title:'A diagnostic habit', text:'Before assuming a business, team, or market is behaving irrationally, check what it is actually being incentivized to do. The behavior is very often a rational response to the incentive structure in place.' }
    ]
  },

  {
    id:'concept-wealth-vs-income', slug:'wealth-vs-income', type:'concept', title:'Wealth vs. Income', category:'Foundations',
    tags:['wealth','income','net worth'], difficulty:'beginner',
    relatedIds:['concept-net-worth','concept-cash-flow','concept-compounding'],
    body:[
      { type:'paragraph', text:'Income is a flow — money arriving over a period of time, usually in exchange for labor or as a return on capital already deployed. Wealth is a stock — what remains after accounting for everything owned minus everything owed, measured at a single point in time. It is possible to have high income and low wealth (a highly-paid professional who spends everything they earn), and low income but substantial wealth (a retiree living off assets built decades earlier).' },
      { type:'heading', text:'Why the distinction matters' },
      { type:'list', items:[
        'Income can usually be lost quickly — a job ends, a client leaves, a market shifts',
        'Wealth, once built, generates its own income independent of continued personal effort',
        'Optimizing purely for income (a bigger salary, a bigger fee) does not automatically translate into wealth unless a meaningful portion is converted into owned, appreciating assets'
      ]},
      { type:'stat', label:'The core relationship', value:'Wealth = Σ(Income − Spending)', sub:'compounded over time at some rate of return' },
      { type:'callout', tone:'gold', title:'The practical takeaway', text:'Every wealth-creation pathway in this system, whatever industry or business model it uses, is really a strategy for converting income into owned assets faster, or for building assets that generate income without ongoing labor.' }
    ]
  },

  {
    id:'concept-assets-vs-liabilities', slug:'assets-vs-liabilities', type:'concept', title:'Assets vs. Liabilities', category:'Foundations',
    tags:['assets','liabilities','balance sheet'], difficulty:'beginner',
    relatedIds:['concept-net-worth','concept-cash-flow'],
    body:[
      { type:'paragraph', text:'In accounting terms, an asset is anything owned that has economic value and could be converted to cash. A liability is an obligation to pay something to someone else in the future. Net worth is simply assets minus liabilities.' },
      { type:'heading', text:'A more useful, cash-flow-based lens' },
      { type:'paragraph', text:'A popular but slightly loose framing distinguishes assets and liabilities by their cash-flow effect: something that puts money in your pocket over time behaves like an asset in practice, and something that takes money out — regardless of what the accounting balance sheet calls it — behaves like a liability. A primary home, for instance, is a real asset on a balance sheet, but if it requires ongoing mortgage, maintenance, and tax payments without producing income, it behaves financially more like a liability day-to-day.' },
      { type:'list', items:[
        'Classic income-producing assets: rental property, dividend-paying equity, a profitable business stake, royalties, interest-bearing instruments',
        'Classic liabilities: consumer debt, depreciating financed purchases, any obligation with a fixed future payment and no offsetting income'
      ]},
      { type:'callout', tone:'blue', title:'Why this distinction gets abused', text:'This framing is popular self-help shorthand, not formal accounting — treat it as a mental model for cash-flow discipline, not a replacement for a real balance sheet.' }
    ]
  },

  {
    id:'concept-net-worth', slug:'net-worth', type:'concept', title:'Net Worth', category:'Foundations',
    tags:['net worth','balance sheet','scoreboard'], difficulty:'beginner',
    relatedIds:['concept-wealth-vs-income','concept-assets-vs-liabilities','concept-cash-flow','concept-inflation'],
    body:[
      { type:'paragraph', text:'Net worth is the total value of everything owned (assets) minus everything owed (liabilities), at a specific moment. It is the closest thing to a single scoreboard number for wealth — but it is a snapshot, not a trend, and it says nothing on its own about liquidity, income quality, or risk concentration.' },
      { type:'heading', text:'What net worth hides' },
      { type:'list', items:[
        'Two people can have identical net worth with completely different risk profiles — one in a single illiquid asset, one diversified across liquid holdings',
        'Net worth can rise purely from asset-price appreciation without any new income being generated — which can reverse just as quickly',
        'It says nothing about the debt structure behind it — a highly leveraged position can show strong net worth right up until it doesn\'t'
      ]},
      { type:'paragraph', text:'Tracking net worth over time — not just its level today — is generally more informative than any single reading, because the trend reveals whether saving, investment returns, or debt paydown are actually moving the number in the intended direction.' }
    ]
  },

  {
    id:'concept-cash-flow', slug:'cash-flow', type:'concept', title:'Cash Flow', category:'Foundations',
    tags:['cash flow','liquidity','operating','investing','financing'], difficulty:'intermediate',
    relatedIds:['concept-assets-vs-liabilities','concept-net-worth','concept-wealth-vs-income'],
    body:[
      { type:'paragraph', text:'Cash flow is the actual movement of money in and out over a period — distinct from paper profit or net worth, both of which can include non-cash items. A business can report a profit on paper while running out of actual cash to pay its bills, if that profit is tied up in unpaid invoices or inventory. This gap between reported profit and available cash has ended companies that looked financially healthy on paper.' },
      { type:'heading', text:'Three categories' },
      { type:'list', items:[
        'Operating cash flow — cash generated by the core, ongoing activity of a business or a person\'s work',
        'Investing cash flow — cash spent on or received from buying and selling long-term assets',
        'Financing cash flow — cash raised from or paid out to lenders and owners (debt, equity, dividends, buybacks)'
      ]},
      { type:'callout', tone:'red', title:'Why illiquidity is a real risk', text:'An asset-rich but cash-poor position is fragile: obligations are due in cash, on specific dates, regardless of how much illiquid wealth sits on the balance sheet. Cash-flow discipline is what prevents a strong net-worth position from becoming a forced, bad-timing sale of assets.' }
    ]
  },

  {
    id:'concept-equity', slug:'equity', type:'concept', title:'Equity', category:'Foundations',
    tags:['equity','ownership','dilution','debt vs equity'], difficulty:'intermediate',
    relatedIds:['concept-ownership','concept-capital-allocation'],
    body:[
      { type:'paragraph', text:'Equity is an ownership claim on an entity — a residual claim, meaning it is paid last, after all other obligations (debt, wages, taxes) are settled, but it also has no ceiling on upside. This is the fundamental trade at the heart of ownership: more risk, uncapped reward, versus fixed, prioritized, but capped return.' },
      { type:'heading', text:'Equity vs. debt' },
      { type:'list', items:[
        'Debt holders are owed a fixed amount regardless of how well the business performs, and are paid before equity holders in a liquidation',
        'Equity holders get whatever is left over — which can be far more than debt in a great outcome, or nothing at all in a bad one',
        'This is why founders and early employees accept below-market cash pay for equity: they are trading certainty for a claim on a much larger, uncapped potential outcome'
      ]},
      { type:'paragraph', text:'Dilution is what happens to an equity stake\'s percentage ownership when new shares are issued — raising capital by selling equity grows the total ownership pool, which shrinks everyone else\'s slice unless they also buy in proportionally.' }
    ]
  },

  {
    id:'concept-ownership', slug:'ownership', type:'concept', title:'Ownership vs. Employment', category:'Foundations',
    tags:['ownership','employment','labor','control rights'], difficulty:'intermediate',
    relatedIds:['concept-equity','concept-wealth-vs-income','concept-capitalism','concept-economic-value-creation'],
    body:[
      { type:'paragraph', text:'Employment trades time and effort for a mostly fixed wage, set in advance, largely independent of how much value that effort actually creates. Ownership trades certainty for a variable, uncapped claim on the value a business or asset generates — and for the control rights (decision-making power) that go with it.' },
      { type:'heading', text:'Why this changes the ceiling' },
      { type:'list', items:[
        'A salaried role has a natural ceiling set by the labor market for that role, regardless of how much value the person personally creates above that',
        'An ownership stake has no such ceiling — value created flows, in principle, entirely to the owners, scaled by their percentage stake',
        'This is why extreme wealth outcomes are overwhelmingly concentrated among owners and investors rather than the highest-paid employees, even in the same industries'
      ]},
      { type:'callout', tone:'gold', title:'The trade-off, stated plainly', text:'Ownership is not strictly better than employment — it carries real downside risk, illiquidity, and uncertainty that a fixed wage does not. It is a different risk/reward position, not a strictly superior one, and the right mix depends on personal risk tolerance, capital, and stage of life.' }
    ]
  },

  {
    id:'concept-capital-allocation', slug:'capital-allocation', type:'concept', title:'Capital Allocation', category:'Foundations',
    tags:['capital allocation','reinvestment','buybacks','dividends','M&A'], difficulty:'advanced',
    relatedIds:['concept-equity','concept-opportunity-cost','concept-compounding','concept-incentives'],
    prerequisites:['concept-equity','concept-opportunity-cost'],
    body:[
      { type:'paragraph', text:'Capital allocation is the set of decisions about what to do with money a business or individual has generated: reinvest in the existing operation, acquire something else, pay down debt, return it to owners via dividends or buybacks, or hold it as cash. Over long periods, the quality of these decisions compounds into a larger determinant of outcomes than almost any single operating decision.' },
      { type:'heading', text:'The main options, compared' },
      { type:'list', items:[
        'Reinvest in the core business — sensible when incremental returns on that capital exceed what could be earned elsewhere',
        'Acquire another business — can add capability or market share quickly, but historically has a high failure rate at destroying rather than creating value when overpaid for',
        'Pay down debt — reduces risk and interest cost, a guaranteed "return" equal to the interest rate avoided',
        'Return capital to owners (dividends, buybacks) — appropriate when the business genuinely cannot reinvest at attractive returns internally',
        'Hold cash — optionality at the cost of near-zero real return, especially under inflation'
      ]},
      { type:'callout', tone:'gold', title:'The core discipline', text:'Good capital allocation is fundamentally about comparing the expected return of every option against every other option — including doing nothing — and it requires the discipline to say no to good-but-not-best uses of capital.' }
    ]
  },

  {
    id:'concept-opportunity-cost', slug:'opportunity-cost', type:'concept', title:'Opportunity Cost', category:'Foundations',
    tags:['opportunity cost','trade-offs','implicit cost'], difficulty:'beginner',
    relatedIds:['concept-capital-allocation','concept-optionality'],
    body:[
      { type:'paragraph', text:'Opportunity cost is the value of the next-best alternative given up when a choice is made. It is invisible on any receipt or balance sheet, which is exactly why it is so often ignored — but every dollar, hour, or unit of attention allocated to one thing is simultaneously a decision not to allocate it to everything else available at that moment.' },
      { type:'heading', text:'Where it hides' },
      { type:'list', items:[
        'Capital sitting in a low-yield account has an opportunity cost equal to the best available return it is forgoing elsewhere',
        'Time spent on a low-leverage task has an opportunity cost equal to the highest-value activity that time could have gone toward instead',
        'Staying in a comfortable but capped role has an opportunity cost equal to the expected value of the highest-potential alternative not pursued'
      ]},
      { type:'callout', tone:'blue', title:'A practical use', text:'Comparing a decision only against "doing nothing" understates its true cost. The right comparison is always against the best realistic alternative — which requires knowing what that alternative actually is.' }
    ]
  },

  {
    id:'concept-optionality', slug:'optionality', type:'concept', title:'Optionality', category:'Foundations',
    tags:['optionality','asymmetric payoff','convexity','risk'], difficulty:'advanced',
    relatedIds:['concept-opportunity-cost','concept-capital-allocation'],
    prerequisites:['concept-opportunity-cost'],
    body:[
      { type:'paragraph', text:'An option, in the broad sense, is the right but not the obligation to take an action later, once more information is available. Optionality is valuable precisely because it lets someone benefit from good news without being forced to absorb the full cost of bad news.' },
      { type:'heading', text:'Asymmetric payoffs' },
      { type:'paragraph', text:'Positions with asymmetric, or convex, payoffs have limited downside and open-ended upside — a small, defined cost buys exposure to a potentially much larger gain. Positions with the opposite shape — small, steady gains most of the time, with rare but catastrophic downside — can look safe for long stretches while quietly carrying enormous hidden risk.' },
      { type:'list', items:[
        'Early-stage equity: capped downside (the amount invested), theoretically uncapped upside',
        'Learning a broadly transferable skill: low cost, and it opens doors whose value isn\'t knowable in advance',
        'Highly leveraged, fixed-payout positions: steady small gains until a single event erases years of them at once'
      ]},
      { type:'callout', tone:'gold', title:'Why this matters for pathway choice', text:'Many wealth-creation strategies covered later in this system are, structurally, bets on preserving or acquiring optionality — keeping the cost of being wrong small while leaving the payoff for being right open-ended.' }
    ]
  },

  {
    id:'concept-compounding', slug:'compounding', type:'concept', title:'Compounding', category:'Foundations',
    tags:['compounding','time','growth','reinvestment'], difficulty:'beginner',
    relatedIds:['concept-wealth-vs-income','concept-net-worth','concept-opportunity-cost'],
    body:[
      { type:'paragraph', text:'Compounding is growth applied to a base that itself keeps growing — each period\'s gain is calculated on the previous period\'s total, not on the original amount alone. Financially, this means reinvested returns earn their own returns. The effect is small and unremarkable at first, and large, almost sudden-looking, later — which is precisely why it is so often underestimated.' },
      { type:'stat', label:'Illustrative example', value:'1.10^30 ≈ 17.4×', sub:'a 10% annual return compounded over 30 years, versus 4× if only the original principal grew linearly' },
      { type:'heading', text:'Compounding is not only financial' },
      { type:'list', items:[
        'Skills compound — each new competency makes the next one faster to acquire and more valuable in combination',
        'Reputation compounds — trust built over many small, consistent interactions opens doors that no single achievement could',
        'Relationships and networks compound — each new connection increases the value and reach of the ones already made'
      ]},
      { type:'callout', tone:'blue', title:'The practical implication', text:'Because most of the value in a compounding process arrives late, the decisions that matter most are usually about what to start early and what not to interrupt — not about finding a shortcut to accelerate the middle.' }
    ]
  },

  {
    id:'concept-inflation', slug:'inflation', type:'concept', title:'Inflation', category:'Foundations',
    tags:['inflation','purchasing power','real returns'], difficulty:'intermediate',
    relatedIds:['concept-net-worth','concept-cash-flow'],
    body:[
      { type:'paragraph', text:'Inflation is a sustained rise in the general price level, which is equivalent to a fall in the purchasing power of a currency — the same unit of money buys less over time. Because of this, holding wealth purely as cash is not neutral: it is a decision to accept a real (inflation-adjusted) loss in exchange for perfect liquidity and safety from nominal loss.' },
      { type:'heading', text:'Nominal vs. real' },
      { type:'list', items:[
        'Nominal return is the stated percentage gain, before adjusting for inflation',
        'Real return is what remains after subtracting inflation — the actual change in purchasing power',
        'A nominal return below the inflation rate is a real loss, even though the account balance is going up'
      ]},
      { type:'paragraph', text:'This is one of the core reasons ownership of productive assets — businesses, real assets, equity — is generally favored over long periods of holding cash: productive assets have some ability to raise prices or grow output alongside inflation, while cash by definition does not.' }
    ]
  },

  {
    id:'concept-productivity', slug:'productivity', type:'concept', title:'Productivity', category:'Foundations',
    tags:['productivity','output','efficiency','growth'], difficulty:'intermediate',
    relatedIds:['concept-economic-value-creation','concept-capitalism'],
    body:[
      { type:'paragraph', text:'Productivity is output produced per unit of input — commonly output per hour worked. At the level of an entire economy, productivity growth is the primary long-run source of rising average living standards: it is the difference between an economy that produces more by working more, and one that produces more by working smarter, with the same effort.' },
      { type:'heading', text:'What raises productivity' },
      { type:'list', items:[
        'Better tools and technology — the same labor hour produces more output',
        'Specialization and division of labor — practice and focus make each task faster and higher quality',
        'Better organization and processes — reducing wasted motion, coordination failures, and duplicated effort',
        'Capital investment — machinery, software, and infrastructure that multiply what a single worker can accomplish'
      ]},
      { type:'callout', tone:'green', title:'Why this matters for individual wealth', text:'At an individual level, the same logic applies: pathways that multiply the value produced per hour of effort — through leverage, technology, or capital — have a structurally higher ceiling than pathways where output scales one-to-one with hours worked.' }
    ]
  },

  {
    id:'concept-economic-value-creation', slug:'economic-value-creation', type:'concept', title:'Economic Value Creation', category:'Foundations',
    tags:['value creation','value capture','positive-sum','zero-sum'], difficulty:'advanced',
    relatedIds:['concept-productivity','concept-capitalism','concept-ownership'],
    prerequisites:['concept-capitalism','concept-productivity'],
    body:[
      { type:'paragraph', text:'Value creation is making something that leaves the world with more total usefulness than before — a genuinely better product, a real efficiency gain, knowledge that didn\'t exist. Value capture is how much of that created value a particular party manages to keep for itself, which can be very different from how much value was actually created.' },
      { type:'heading', text:'Why the distinction matters' },
      { type:'list', items:[
        'A business can create enormous value for customers and society while capturing very little of it for itself (heavy competition can force most value to flow to consumers as low prices)',
        'A business can capture a great deal of value while creating comparatively little (extracting rents through market power, information asymmetry, or regulatory capture)',
        'Durable wealth generally requires some mechanism — a moat — that allows meaningful value capture alongside value creation, not creation alone'
      ]},
      { type:'paragraph', text:'Positive-sum activity grows the total pie — trade, genuine innovation, productivity gains. Zero-sum activity only redistributes an existing pie — most short-term speculation, and some forms of rent-seeking. Distinguishing which kind of activity a given wealth pathway represents is one of the most useful diagnostic questions in this entire system.' },
      { type:'callout', tone:'gold', title:'The through-line to every pathway', text:'Every wealth engine explored later — SaaS, real estate, funds, media, manufacturing — will be evaluated partly on this question: how much value does it create, and what mechanism, if any, lets it capture a durable share of that value?' }
    ]
  }
]);

  {"id":"concept-cash-flow-statement","slug":"cash-flow-statement","type":"concept","title":"Cash Flow Statement","category":"Accounting & Statements","tags":["cash-flow","operating-cash-flow","capex","free-cash-flow"],"difficulty":"intermediate","relatedIds":["concept-income-statement","concept-balance-sheet","concept-cash-flow","concept-capital-allocation"],"body":[{"type":"paragraph","text":"Cash flow reveals whether reported economics actually turn into spendable financial resources. Wealth compounds through cash that can be reinvested, distributed or used to reduce risk."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Operating cash flow","Capital expenditure","Free cash flow","Working-capital effects","Cash conversion","Financing cash flows","Owner cash flow","Cash flow quality versus accounting earnings"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"Free cash flow is not automatically superior to growth: the key question is whether reinvested cash earns attractive incremental returns."}],"lastUpdated":"2026-08-31"},
  {"id":"concept-time-value-of-money","slug":"time-value-of-money","type":"concept","title":"Time Value of Money","category":"Investing & Portfolio","tags":["discounting","present-value","future-value","compounding"],"difficulty":"beginner","relatedIds":["concept-compounding","concept-capital-allocation","concept-equity-valuation","concept-opportunity-cost"],"body":[{"type":"paragraph","text":"A rupee or dollar today is not economically equivalent to the same amount received years later. Time value connects savings, investing, valuation, debt and opportunity cost through a common mathematical language."},{"type":"heading","text":"Study checklist"},{"type":"list","items":["Present value and future value","Discount factors","Compounding frequency","Effective versus nominal rates","Annuities and perpetuities","Net present value","Internal rate of return","Real versus nominal returns"]},{"type":"callout","tone":"gold","title":"Wealth OS lens","text":"The practical lesson is brutal: always compare opportunities on the same time basis before deciding that one headline return is better than another."}],"lastUpdated":"2026-08-31"},
